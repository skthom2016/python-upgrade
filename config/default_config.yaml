# SecurePythonUpgradeProject Configuration
# This is the default configuration template

python:
  # Source Python version: 'auto' for auto-detection, or explicit version like '3.6'
  source_version: auto

  # Target Python version: Mandatory, specify the version you're upgrading to
  target_version: null

scan:
  # Enable resume from checkpoint if analysis was interrupted
  resume: true

  # Enable parallel processing for faster analysis
  parallel: true

  # Verbose mode: show file-by-file output during analysis
  verbose: false

paths:
  # Source directory to analyze
  source: "./src"

  # Output directory for reports and cache
  output: "./output"

performance:
  # Maximum number of worker processes (null for auto-detect based on CPU cores)
  max_workers: null

  # Stop spawning new workers when memory usage reaches this percentage
  memory_limit: 70

  # Stop spawning new workers when CPU usage reaches this percentage
  cpu_limit: 90

baseline:
  # Path to baseline file for ignoring known issues
  file: null

cache:
  # Enable caching of analysis results
  enabled: true

  # Cache expiration time in days (null for never expire)
  expiration_days: 30

reporting:
  # Include code snippets in the report
  include_snippets: true

  # Number of lines to show in code snippets
  snippet_lines: 3

  # Maximum number of files to show in top problematic files list
  top_files_count: 10

llm:
  # Enable LLM-based detection for context-dependent and semantic issues
  enabled: true

  # Ollama server host
  host: "http://localhost:11434"

  # Model to use for analysis (qwen2.5:7b recommended)
  model: "qwen2.5:7b"

  # Temperature for generation (0.0-1.0, lower = more deterministic)
  temperature: 0.1

  # Request timeout in seconds
  timeout: 30

  # Maximum tokens per request (null for no limit)
  max_tokens: null

  # Graceful degradation: if true, continue with AST-only if LLM unavailable
  graceful_degradation: true

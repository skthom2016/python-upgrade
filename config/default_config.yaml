python:
  source_version: auto
  target_version: null
scan:
  resume: true
  parallel: true
  verbose: false
paths:
  source: ./src
  output: ./output
performance:
  max_workers: null
  memory_limit: 70
  cpu_limit: 90
baseline:
  file: null
cache:
  enabled: true
  expiration_days: 30
reporting:
  include_snippets: true
  snippet_lines: 3
  top_files_count: 10
llm:
  enabled: true
  host: http://localhost:11434
  model: qwen2.5-coder:.5b
  temperature: 0.1
  timeout: 30
  max_tokens: null
  graceful_degradation: true
  validation_mode: batch

- id: "PY310DF23"
  name: "typing.Text deprecated"
  category: "deprecation"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.10"
  target_version: "3.11"
  description: |
    typing.Text is deprecated in Python 3.11. It was an alias for str
    to support Python 2 compatibility.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "ImportFrom"
    attributes:
      module: "typing"
    children:
      names:
        - node_type: "alias"
          attributes:
            name: "Text"
  message: |
    typing.Text is deprecated in Python 3.11.
  suggestion: |
    Use str instead of typing.Text.
  examples:
    bad: "from typing import Text\ndef foo(x: Text) -> Text: ..."
    good: "def foo(x: str) -> str: ..."
  references:
    - "https://docs.python.org/3/whatsnew/3.11.html#deprecated"
    - "https://docs.python.org/3/library/typing.html"


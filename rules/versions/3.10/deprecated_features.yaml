# Deprecated features when upgrading from Python 3.10 to 3.11+

- id: "PY310DF01"
  name: "aifc module deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.10"
  target_version: "3.11"
  description: |
    The aifc module is deprecated in Python 3.11 (PEP 594) and will be removed in 3.13.
    This module provides support for reading and writing AIFF and AIFF-C files.
  detector: "DeprecatedImportsDetector"
  pattern:
    node_type: "Import"
    children:
      names:
        - node_type: "alias"
          attributes:
            name: "aifc"
  message: |
    The 'aifc' module is deprecated in Python 3.11 and will be removed in 3.13 (PEP 594).
  suggestion: |
    Consider using third-party audio libraries like pydub or soundfile.
  references:
    - "https://peps.python.org/pep-0594/"
    - "https://docs.python.org/3/whatsnew/3.11.html#deprecated"


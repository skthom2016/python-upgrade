- id: "PY310DF20"
  name: "unittest deprecated aliases"
  category: "deprecation"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.10"
  target_version: "3.11"
  description: |
    Several unittest.TestCase method aliases are deprecated in Python 3.11:
    failUnless, failIf, failUnlessEqual, failIfEqual, failUnlessAlmostEqual,
    failIfAlmostEqual, failUnlessRaises, assertEquals, assertNotEquals,
    assertAlmostEquals, assertNotAlmostEquals, assert_.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Attribute"
        attributes:
          attr: "regex:(failUnless|failIf|failUnlessEqual|failIfEqual|failUnlessAlmostEqual|failIfAlmostEqual|failUnlessRaises|assertEquals|assertNotEquals|assertAlmostEquals|assertNotAlmostEquals|assert_)"
  message: |
    unittest.TestCase method aliases are deprecated in Python 3.11.
  suggestion: |
    Use the modern method names: assertTrue, assertFalse, assertEqual, assertNotEqual,
    assertAlmostEqual, assertNotAlmostEqual, assertRaises.
  examples:
    bad: "self.assertEquals(a, b)"
    good: "self.assertEqual(a, b)"
  references:
    - "https://docs.python.org/3/whatsnew/3.11.html#deprecated"
    - "https://docs.python.org/3/library/unittest.html"

- id: "PY310DF21"
  name: "locale.getdefaultlocale() deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.10"
  target_version: "3.11"
  description: |
    locale.getdefaultlocale() is deprecated in Python 3.11 and will be removed in 3.13.
    This function has implementation issues and is not reliable.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Attribute"
        children:
          value:
            node_type: "Name"
            attributes:
              id: "locale"
          attr: "getdefaultlocale"
  message: |
    locale.getdefaultlocale() is deprecated in Python 3.11 and will be removed in 3.13.
  suggestion: |
    Use locale.setlocale(), locale.getlocale(), or locale.getpreferredencoding(False) instead.
  examples:
    bad: "lang, encoding = locale.getdefaultlocale()"
    good: "encoding = locale.getpreferredencoding(False)"
  references:
    - "https://docs.python.org/3/whatsnew/3.11.html#deprecated"
    - "https://docs.python.org/3/library/locale.html"


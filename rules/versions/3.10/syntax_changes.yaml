- id: PY310SC07
  name: Required and NotRequired for TypedDict available
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    PEP 655 adds Required and NotRequired for marking individual TypedDict
    fields as required or not required. Available in Python 3.11+.
  detector: SyntaxChangesDetector
  pattern:
    node_type: ImportFrom
    attributes:
      module: typing
    children:
      names:
      - node_type: alias
        attributes:
          name: regex:(Required|NotRequired)
  message: |
    Required and NotRequired (PEP 655) require Python 3.11+ or typing_extensions.
  suggestion: |
    For Python 3.10, install typing_extensions: pip install typing_extensions
  examples:
    bad: from typing import TypedDict, Required, NotRequired
    good: |-
      from typing import TypedDict
      from typing_extensions import Required, NotRequired
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#pep-655-marking-individual-typeddict-items-as-required-or-potentially-missing
  - https://peps.python.org/pep-0655/

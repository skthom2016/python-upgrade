- id: PY310SC15
  name: Starred unpacking in for statements
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    Python 3.11 allows starred expressions in for statements for more flexible
    iteration unpacking patterns.
  detector: SyntaxChangesDetector
  pattern:
    node_type: For
    children:
      target:
        node_type: Starred
  message: |
    Starred unpacking in for statements requires Python 3.11+.
  suggestion: |
    For Python 3.10, manually unpack in the loop body.
  examples:
    bad: 'for *rest, last in items: ...'
    good: |-
      for item in items:
          *rest, last = item
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#other-language-changes
- id: PY310SC16
  name: Format spec 'z' option for negative zero
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    Python 3.11 adds the 'z' format spec option that coerces negative zero
    floating-point values to positive zero after rounding.
  detector: SyntaxChangesDetector
  pattern:
    node_type: JoinedStr
    attributes:
      format_spec: regex:.*z.*
  message: |
    Format spec 'z' option requires Python 3.11+.
  suggestion: |
    For Python 3.10, manually check for negative zero: value if value != 0 else 0
  examples:
    bad: f'{value:z.2f}'
    good: f'{value if value != 0 else 0:.2f}'
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#other-language-changes
- id: PY310SC17
  name: Asynchronous comprehensions outside async functions
  category: informational
  severity: info
  risk_level: LOW
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: info
  description: |
    Python 3.11 improves error messages when asynchronous comprehensions
    are used outside async functions, providing clearer diagnostics.
  detector: InformationalDetector
  pattern:
    node_type: ListComp
    children:
      generators:
      - node_type: comprehension
        attributes:
          is_async: true
  message: |
    Python 3.11 provides better error messages for async comprehensions outside async functions.
  suggestion: |
    Ensure asynchronous comprehensions are only used within async functions.
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#other-language-changes

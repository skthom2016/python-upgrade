# Syntax Changes when upgrading from Python 3.10
# New syntax features and breaking syntax changes

- id: PY310SC01
  name: Exception groups available
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    PEP 654 introduces exception groups and except* syntax in Python 3.11.
    ExceptionGroup and BaseExceptionGroup allow raising and handling multiple
    exceptions simultaneously.
  detector: SyntaxChangesDetector
  pattern:
    node_type: ExceptHandler
    attributes:
      star: true
  message: |
    Exception groups (except*) are not available in Python 3.10.
  suggestion: |
    This code requires Python 3.11+. For Python 3.10, handle exceptions individually.
  examples:
    bad: |
      try:
          raise ExceptionGroup("group", [ValueError(), TypeError()])
      except* ValueError as e:
          print(f"ValueError: {e}")
    good: |
      try:
          # Handle exceptions individually in Python 3.10
          pass
      except ValueError as e:
          print(f"ValueError: {e}")
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#pep-654-exception-groups-and-except
  - https://peps.python.org/pep-0654/
- id: PY310SC02
  name: ExceptionGroup class available
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    ExceptionGroup and BaseExceptionGroup classes are available in Python 3.11
    for creating groups of exceptions (PEP 654).
  detector: SyntaxChangesDetector
  pattern:
    node_type: Name
    attributes:
      id: regex:(ExceptionGroup|BaseExceptionGroup)
  message: |
    ExceptionGroup is not available in Python 3.10.
  suggestion: |
    Use the exceptiongroup backport package for Python 3.10: pip install exceptiongroup
  examples:
    bad: raise ExceptionGroup('errors', [ValueError(), TypeError()])
    good: 'from exceptiongroup import ExceptionGroup  # Backport for 3.10'
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#pep-654-exception-groups-and-except
  - https://peps.python.org/pep-0654/
- id: PY310SC03
  name: TypeVarTuple for variadic generics available
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    PEP 646 adds TypeVarTuple for variadic generics in Python 3.11.
    This allows type variables to represent an arbitrary number of types.
  detector: SyntaxChangesDetector
  pattern:
    node_type: ImportFrom
    attributes:
      module: typing
    children:
      names:
      - node_type: alias
        attributes:
          name: TypeVarTuple
  message: |
    TypeVarTuple (PEP 646) requires Python 3.11+ or typing_extensions.
  suggestion: |
    For Python 3.10, install typing_extensions: pip install typing_extensions
  examples:
    bad: from typing import TypeVarTuple
    good: from typing_extensions import TypeVarTuple
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#pep-646-variadic-generics
  - https://peps.python.org/pep-0646/

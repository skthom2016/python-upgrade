# Breaking Changes when upgrading from Python 3.10
# These changes will cause code to break or behave differently

- id: PY310BC01
  name: binhex module removed
  category: breaking_change
  severity: high
  risk_level: HIGH
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: high
  description: |
    The binhex module was deprecated in Python 3.9 and removed in 3.11.
    It provided binhex4 encoding/decoding for Mac files.
  detector: DeprecatedImportsDetector
  pattern:
    node_type: Import
    children:
      names:
      - node_type: alias
        attributes:
          name: binhex
  message: |
    The binhex module was removed in Python 3.11.
  suggestion: |
    If you need binhex functionality, copy the implementation from Python 3.10 or earlier.
  examples:
    bad: import binhex
    good: '# Copy binhex module from Python 3.10 if needed'
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#removed
- id: PY310BC02
  name: asyncio.coroutine decorator removed
  category: breaking_change
  severity: high
  risk_level: HIGH
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: high
  description: |
    The @asyncio.coroutine decorator for legacy generator-based coroutines
    was removed. Use async def instead.
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Attribute
    children:
      value:
        node_type: Name
        attributes:
          id: asyncio
      attr: coroutine
  message: |
    @asyncio.coroutine decorator was removed in Python 3.11.
  suggestion: |
    Convert generator-based coroutines to async def functions.
  examples:
    bad: |-
      @asyncio.coroutine
      def coro():
          yield from asyncio.sleep(1)
    good: |-
      async def coro():
          await asyncio.sleep(1)
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#removed
- id: PY310BC03
  name: asyncio._reuse_address parameter removed
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    The _reuse_address parameter was removed from asyncio.loop.create_datagram_endpoint()
    due to security concerns with SO_REUSEADDR in UDP.
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Attribute
        attributes:
          attr: create_datagram_endpoint
      keywords:
      - node_type: keyword
        attributes:
          arg: reuse_address
  message: |
    The reuse_address parameter was removed from create_datagram_endpoint().
  suggestion: |
    Remove the reuse_address parameter from create_datagram_endpoint() calls.
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#removed

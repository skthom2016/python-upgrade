- id: PY310BC12
  name: regex global inline flags restricted
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    Global inline flags like (?i) can only be used at the start of regular
    expression patterns (deprecated since Python 3.6).
  detector: RegexPatternDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Attribute
        children:
          value:
            node_type: Name
            attributes:
              id: re
          attr: regex:(compile|search|match|findall|finditer)
  message: |
    Global inline flags must appear at the start of regex patterns in Python 3.11.
  suggestion: |
    Move (?i), (?m), (?s), etc. to the beginning of your pattern, or use flag parameters.
  examples:
    bad: re.search(r'hello(?i)world', text)
    good: re.search(r'(?i)helloworld', text)
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#changes-in-the-python-api
- id: PY310BC13
  name: context manager TypeError instead of AttributeError
  category: breaking_change
  severity: low
  risk_level: LOW
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: hybrid
    confidence: medium
    requires_llm: true
    priority: low
    semantic_description: |-
      context manager TypeError instead of AttributeError requires context validation to avoid false positives.
      When an object doesn't support the context manager protocol,
      TypeError is now raised instead of AttributeError....

      The rule should be validated to ensure it matches the intended context.
    detection_criteria:
      ast_pattern: With node with specific attributes
      text_keywords: []
      validation_prompt: |-
        Validate if this code matches the rule: context manager TypeError instead of AttributeError
        Check for context-specific conditions and edge cases.
        Ensure the pattern is not a false positive.
  description: |
    When an object doesn't support the context manager protocol,
    TypeError is now raised instead of AttributeError.
  detector: BehaviorChangeDetector
  pattern:
    node_type: With
  message: |
    Context manager protocol errors now raise TypeError instead of AttributeError.
  suggestion: |
    Update exception handlers catching AttributeError for context managers to catch TypeError.
  examples:
    bad: |-
      try:
          with obj:
              pass
      except AttributeError:
          pass
    good: |-
      try:
          with obj:
              pass
      except TypeError:
          pass
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#changes-in-the-python-api
- id: PY310BC14
  name: integer string conversion limit enforced
  category: breaking_change
  severity: high
  risk_level: HIGH
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: high
  description: |
    Converting between int and str in non-power-of-2 bases now raises ValueError
    if the digit count exceeds a limit (default 4300 digits). CVE-2020-10735 mitigation.
  detector: SecurityDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Name
        attributes:
          id: regex:(int|str)
  message: |
    Large integer string conversions may raise ValueError in Python 3.11 (CVE-2020-10735).
  suggestion: |
    For very large integers, increase the limit using sys.set_int_max_str_digits() or handle ValueError.
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#changes-in-the-python-api
  - https://docs.python.org/3/library/stdtypes.html#int-max-str-digits
- id: PY310BC15
  name: asyncio non-ThreadPoolExecutor prohibited
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    Passing non-ThreadPoolExecutor executors to asyncio.loop.set_default_executor()
    now raises TypeError (deprecated since Python 3.8).
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Attribute
        attributes:
          attr: set_default_executor
  message: |
    set_default_executor() only accepts ThreadPoolExecutor in Python 3.11.
  suggestion: |
    Use concurrent.futures.ThreadPoolExecutor as the executor.
  examples:
    bad: loop.set_default_executor(ProcessPoolExecutor())
    good: loop.set_default_executor(ThreadPoolExecutor())
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#removed
- id: PY310BC16
  name: sys.exc_info exception representation changed
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    Exception handler representation changed. Only exc_value field retained;
    exc_type and exc_traceback are now derived from exc_value.
  detector: BehaviorChangeDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Attribute
        children:
          value:
            node_type: Name
            attributes:
              id: sys
          attr: exc_info
  message: |
    sys.exc_info() now derives type and traceback from the exception value.
  suggestion: |
    Code accessing exc_type or exc_traceback directly may need updates.
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#changes-in-the-python-api
- id: PY310BC17
  name: object.__getstate__() now implemented
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    object.__getstate__() is now implemented for various types, which may
    break code not expecting __getstate__() to exist.
  detector: BehaviorChangeDetector
  pattern:
    node_type: Attribute
    attributes:
      attr: __getstate__
  message: |
    __getstate__() is now implemented for several builtin types in Python 3.11.
  suggestion: |
    Update code that checks for __getstate__() existence or calls it on builtin types.
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#changes-in-the-python-api
- id: PY310BC18
  name: bytes not accepted on sys.path
  category: breaking_change
  severity: low
  risk_level: LOW
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: low
  description: |
    Bytes are no longer accepted on sys.path. Support was broken and is now
    formally removed.
  detector: BehaviorChangeDetector
  pattern:
    node_type: Subscript
    children:
      value:
        node_type: Attribute
        children:
          value:
            node_type: Name
            attributes:
              id: sys
          attr: path
  message: |
    sys.path no longer accepts bytes objects in Python 3.11.
  suggestion: |
    Use string paths instead of bytes in sys.path.
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#other-language-changes

- id: PY310BC07
  name: inspect.getargspec removed
  category: breaking_change
  severity: high
  risk_level: HIGH
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: high
  description: |
    inspect.getargspec() was removed (deprecated since Python 3.0).
    Use inspect.signature() instead.
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Attribute
        children:
          value:
            node_type: Name
            attributes:
              id: inspect
          attr: getargspec
  message: |
    inspect.getargspec() was removed in Python 3.11.
  suggestion: |
    Use inspect.signature() or inspect.getfullargspec() instead.
  examples:
    bad: inspect.getargspec(func)
    good: inspect.signature(func)
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#removed

- id: PY310BC09
  name: file mode 'U' removed
  category: breaking_change
  severity: high
  risk_level: HIGH
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: high
  description: |
    The 'U' mode (universal newlines) is no longer accepted in open(),
    io.open(), codecs.open(), and fileinput.FileInput().
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Name
        attributes:
          id: open
      args:
      - node_type: Constant
        attributes:
          value: regex:.*U.*
  message: |
    File mode 'U' was removed in Python 3.11.
  suggestion: |
    Remove 'U' from mode string. Universal newlines are default in text mode.
  examples:
    bad: open('file.txt', 'rU')
    good: open('file.txt', 'r')
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#changes-in-the-python-api
- id: PY310BC10
  name: random.sample set auto-conversion removed
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    random.sample() no longer auto-converts sets to lists. The population
    parameter must be a sequence.
  detector: BehaviorChangeDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Attribute
        children:
          value:
            node_type: Name
            attributes:
              id: random
          attr: sample
  message: |
    random.sample() requires a sequence, not a set, in Python 3.11.
  suggestion: |
    Convert sets to lists: random.sample(list(my_set), k)
  examples:
    bad: random.sample(my_set, 5)
    good: random.sample(list(my_set), 5)
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#changes-in-the-python-api

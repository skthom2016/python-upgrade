# Stdlib Changes when upgrading from Python 3.10
# Changes to modules, functions, and classes in the Python standard library

- id: PY310SL01
  name: tomllib module available
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: info
  description: |
    PEP 680 adds tomllib module for parsing TOML (Tom's Obvious Minimal Language)
    files. This is a read-only implementation in the standard library.
  detector: NewModuleDetector
  pattern:
    node_type: Import
    children:
      names:
      - node_type: alias
        attributes:
          name: tomllib
  message: |
    tomllib module (PEP 680) is available in Python 3.11+.
  suggestion: |
    For Python 3.10, use the tomli package: pip install tomli
  examples:
    bad: import tomllib
    good: |-
      try:
          import tomllib
      except ImportError:
          import tomli as tomllib
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#pep-680-tomllib-support-for-parsing-toml-in-the-standard-library
  - https://peps.python.org/pep-0680/

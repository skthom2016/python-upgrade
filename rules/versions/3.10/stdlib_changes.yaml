    operator.call(obj, *args, **kwargs) is equivalent to obj(*args, **kwargs).
    Useful for functional programming.
  detector: NewAPIDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Attribute
        children:
          value:
            node_type: Name
            attributes:
              id: operator
          attr: call
  message: |
    operator.call() is available in Python 3.11+.
  suggestion: |
    For Python 3.10, use lambda obj, *args, **kw: obj(*args, **kw).
  examples:
    bad: operator.call(func, arg1, arg2)
    good: '(lambda f, *args: f(*args))(func, arg1, arg2)'
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#operator
  - https://docs.python.org/3/library/operator.html#operator.call

- id: PY310SL05
  name: contextlib.chdir() context manager available
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.10'
  target_version: '3.11'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    contextlib.chdir() provides a context manager for temporarily changing
    the current working directory.
  detector: NewAPIDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Attribute
        children:
          value:
            node_type: Name
            attributes:
              id: contextlib
          attr: chdir
  message: |
    contextlib.chdir() is available in Python 3.11+.
  suggestion: |
    For Python 3.10, manually use os.chdir() with try/finally.
  examples:
    bad: 'with contextlib.chdir(path): ...'
    good: |
      old_cwd = os.getcwd()
      try:
          os.chdir(path)
          ...
      finally:
          os.chdir(old_cwd)
  references:
  - https://docs.python.org/3/whatsnew/3.11.html#contextlib
  - https://docs.python.org/3/library/contextlib.html#contextlib.chdir

- id: PY39SC06
  name: PEP 626 precise line numbers
  category: informational
  severity: info
  risk_level: LOW
  source_version: '3.9'
  target_version: '3.10'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    Python 3.10 implements PEP 626, providing precise line numbers for debugging
    and tracing. Frame objects now have accurate f_lineno values.
  detector: InformationalDetector
  pattern:
    node_type: Attribute
    attributes:
      attr: f_lineno
  message: |
    Python 3.10 provides precise line numbers (PEP 626) for better debugging.
  suggestion: |
    If you're doing frame introspection, Python 3.10+ provides more accurate line numbers.
  references:
  - https://docs.python.org/3/whatsnew/3.10.html#pep-626-precise-line-numbers-for-debugging-and-other-tools
  - https://peps.python.org/pep-0626/
- id: PY39SC07
  name: Assignment expressions in set literals
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.9'
  target_version: '3.10'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    Unparenthesized walrus operator (:=) in set literals and comprehensions is
    now allowed in Python 3.10.
  detector: SyntaxChangesDetector
  pattern:
    node_type: SetComp
    children:
      generators:
      - node_type: comprehension
        children:
          iter:
            node_type: NamedExpr
  message: |
    Unparenthesized assignment expressions in set literals require Python 3.10+.
  suggestion: |
    For Python 3.9, use parentheses: {(y := x) for x in range(5)}
  examples:
    bad: '{y := x for x in range(5)}'
    good: '{(y := x) for x in range(5)}'
  references:
  - https://docs.python.org/3/whatsnew/3.10.html#other-language-changes
- id: PY39SC08
  name: TypeAlias annotation available
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.9'
  target_version: '3.10'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    PEP 613 adds TypeAlias annotation for explicit type alias declarations.
    This is available in Python 3.10+ via typing module.
  detector: SyntaxChangesDetector
  pattern:
    node_type: AnnAssign
    children:
      annotation:
        node_type: Name
        attributes:
          id: TypeAlias
  message: |
    TypeAlias annotation (PEP 613) requires Python 3.10+ or typing_extensions.
  suggestion: |
    For Python 3.9, install typing_extensions: pip install typing_extensions
  examples:
    bad: 'StrCache: TypeAlias = ''Cache[str]'''
    good: |-
      from typing_extensions import TypeAlias
      StrCache: TypeAlias = 'Cache[str]'
  references:
  - https://docs.python.org/3/whatsnew/3.10.html#pep-613-explicit-type-aliases
  - https://peps.python.org/pep-0613/
- id: PY39SC09
  name: ParamSpec available
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.9'
  target_version: '3.10'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    PEP 612 adds ParamSpec for parameter specification variables in typing.
    This is available in Python 3.10+ via typing module.
  detector: SyntaxChangesDetector
  pattern:
    node_type: ImportFrom
    attributes:
      module: typing
    children:
      names:
      - node_type: alias
        attributes:
          name: ParamSpec
  message: |
    ParamSpec (PEP 612) requires Python 3.10+ or typing_extensions.
  suggestion: |
    For Python 3.9, install typing_extensions: pip install typing_extensions
  examples:
    bad: from typing import ParamSpec
    good: from typing_extensions import ParamSpec
  references:
  - https://docs.python.org/3/whatsnew/3.10.html#pep-612-parameter-specification-variables
  - https://peps.python.org/pep-0612/

# Syntax changes when upgrading from Python 3.9 to 3.10+

- id: "PY3920"
  name: "Match statement not available"
  category: "deprecation"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.9"
  target_version: "3.10"
  description: |
    Structural pattern matching (match/case) is not available in Python 3.9.
    It was introduced in Python 3.10.
  detector: "SyntaxChangesDetector"
  pattern:
    node_type: "Name"
    attributes:
      id: "PLACEHOLDER"
  message: |
    Pattern matching with match/case is not available until Python 3.10.
  suggestion: |
    Upgrade to Python 3.10+ to use structural pattern matching.
  references:
    - "https://docs.python.org/3/whatsnew/3.10.html#pep-634-structural-pattern-matching"

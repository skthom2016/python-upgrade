# Syntax Changes when upgrading from Python 3.9
# New syntax features and breaking syntax changes

- id: PY39SC01
  name: Structural pattern matching available
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.9'
  target_version: '3.10'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    Structural pattern matching with match/case statements is available in
    Python 3.10+ (PEP 634, 635, 636). This is not available in Python 3.9.
  detector: SyntaxChangesDetector
  pattern:
    node_type: Match
  message: |
    Structural pattern matching (match/case) is not available in Python 3.9.
  suggestion: |
    This code requires Python 3.10+. Use if/elif chains for Python 3.9 compatibility.
  examples:
    bad: |
      match status:
          case 404:
              return "Not found"
    good: |
      if status == 404:
          return "Not found"
  references:
  - https://docs.python.org/3/whatsnew/3.10.html#pep-634-structural-pattern-matching
  - https://peps.python.org/pep-0634/
  - https://peps.python.org/pep-0635/
  - https://peps.python.org/pep-0636/
- id: PY39SC02
  name: Parenthesized context managers available
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.9'
  target_version: '3.10'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    Parenthesized context managers allow spanning multiple lines using
    parentheses in with statements (PEP 617). This is not available in Python 3.9.
  detector: SyntaxChangesDetector
  pattern:
    node_type: With
    attributes:
      paren_context: true
  message: |
    Parenthesized context managers are not available in Python 3.9.
  suggestion: |
    For Python 3.9, use backslash line continuation or nested with statements.
  examples:
    bad: |
      with (
          open('a.txt') as a,
          open('b.txt') as b,
      ):
          pass
    good: |
      with open('a.txt') as a, \
           open('b.txt') as b:
          pass
  references:
  - https://docs.python.org/3/whatsnew/3.10.html#parenthesized-context-managers
  - https://peps.python.org/pep-0617/
- id: PY39SC03
  name: Type union operator available
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.9'
  target_version: '3.10'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    The | operator for type unions (PEP 604) is available in Python 3.10+.
    This is not available in Python 3.9.
  detector: SyntaxChangesDetector
  pattern:
    node_type: BinOp
    children:
      op:
        node_type: BitOr
    attributes:
      context: type_annotation
  message: |
    Type union operator (|) is not available in Python 3.9 for type hints.
  suggestion: |
    For Python 3.9, use typing.Union instead: Union[int, str]
  examples:
    bad: 'def func(x: int | str) -> int | float: ...'
    good: |-
      from typing import Union
      def func(x: Union[int, str]) -> Union[int, float]: ...
  references:
  - https://docs.python.org/3/whatsnew/3.10.html#pep-604-new-type-union-operator
  - https://peps.python.org/pep-0604/
- id: PY39SC04
  name: isinstance/issubclass with union operator
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.9'
  target_version: '3.10'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    Using | operator with isinstance() and issubclass() is available in
    Python 3.10+. This is not available in Python 3.9.
  detector: SyntaxChangesDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Name
        attributes:
          id: regex:(isinstance|issubclass)
      args:
      - node_type: BinOp
        children:
          op:
            node_type: BitOr
  message: |
    Using | operator with isinstance/issubclass is not available in Python 3.9.
  suggestion: |
    For Python 3.9, use tuple syntax: isinstance(x, (int, str))
  examples:
    bad: isinstance(x, int | str)
    good: isinstance(x, (int, str))
  references:
  - https://docs.python.org/3/whatsnew/3.10.html#pep-604-new-type-union-operator
  - https://peps.python.org/pep-0604/

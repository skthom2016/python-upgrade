# Deprecated Features when upgrading from Python 3.9
# These features are deprecated and will be removed in future versions

- id: PY39DF01
  name: distutils module deprecated
  category: deprecation
  severity: high
  risk_level: HIGH
  source_version: '3.9'
  target_version: '3.12'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: high
  description: |
    The entire distutils module is deprecated in Python 3.10 and will be
    removed in Python 3.12. Use setuptools or packaging instead.
  detector: DeprecatedImportsDetector
  pattern:
    node_type: Import
    children:
      names:
      - node_type: alias
        attributes:
          name: regex:distutils.*
  message: |
    The distutils module is deprecated and will be removed in Python 3.12.
  suggestion: |
    Migrate to setuptools for package building, or use 'packaging' for version parsing and other utilities.
  examples:
    bad: from distutils.version import LooseVersion
    good: from packaging.version import Version
  references:
  - https://docs.python.org/3/whatsnew/3.10.html#deprecated
  - https://peps.python.org/pep-0632/

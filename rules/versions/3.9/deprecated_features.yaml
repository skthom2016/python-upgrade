- id: PY39DF05
  name: Numeric literal followed by keyword
  category: deprecation
  severity: medium
  risk_level: MEDIUM
  source_version: '3.9'
  target_version: '3.12'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    Numeric literals immediately followed by keywords emit DeprecationWarning
    and will become SyntaxError in future versions.
  detector: SyntaxChangesDetector
  pattern:
    node_type: Constant
    attributes:
      value: regex:^[0-9]
  message: |
    Numeric literals immediately followed by keywords will become SyntaxError.
  suggestion: |
    Add whitespace between numeric literals and keywords: '0 in x' not '0in x'
  examples:
    bad: 0in x, 1or y, 0if 1else 2
    good: 0 in x, 1 or y, 0 if 1 else 2
  references:
  - https://docs.python.org/3/whatsnew/3.10.html#deprecated

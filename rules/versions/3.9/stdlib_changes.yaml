- id: "PY39SL09"
  name: "dataclasses slots parameter available"
  category: "new_feature"
  severity: "info"
  risk_level: "LOW"
  source_version: "3.9"
  target_version: "3.10"
  description: |
    dataclass decorator's slots parameter generates __slots__. Available in Python 3.10+.
  detector: "StdlibChangesDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Name"
        attributes:
          id: "dataclass"
      keywords:
        - node_type: "keyword"
          attributes:
            arg: "slots"
  message: |
    dataclass(slots=True) parameter is not available in Python 3.9.
  suggestion: |
    For Python 3.9, manually define __slots__ in the class.
  examples:
    bad: "@dataclass(slots=True)\nclass Point: ..."
    good: "@dataclass\nclass Point:\n    __slots__ = ('x', 'y')\n    x: float\n    y: float"
  references:
    - "https://docs.python.org/3/whatsnew/3.10.html#dataclasses"


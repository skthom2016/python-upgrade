- id: "PY39SL20"
  name: "SSL OpenSSL 1.1.1+ required"
  category: "requirement_change"
  severity: "high"
  risk_level: "HIGH"
  source_version: "3.9"
  target_version: "3.10"
  description: |
    Python 3.10 requires OpenSSL 1.1.1 or newer (PEP 644). OpenSSL 1.0.2 is
    no longer supported.
  detector: "EnvironmentDetector"
  pattern:
    node_type: "Import"
    children:
      names:
        - node_type: "alias"
          attributes:
            name: "ssl"
  message: |
    Python 3.10 requires OpenSSL 1.1.1+ (OpenSSL 1.0.2 is no longer supported).
  suggestion: |
    Ensure your system has OpenSSL 1.1.1 or newer before upgrading to Python 3.10.
  references:
    - "https://docs.python.org/3/whatsnew/3.10.html#build-changes"
    - "https://peps.python.org/pep-0644/"

- id: "PY39SL21"
  name: "SSL improved security defaults"
  category: "security_change"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.9"
  target_version: "3.10"
  description: |
    Python 3.10 ssl module has more secure defaults: disabled ciphers without
    forward secrecy/SHA-1 MAC, security level 2, TLS 1.2 minimum by default.
  detector: "SecurityDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Attribute"
        children:
          value:
            node_type: "Name"
            attributes:
              id: "ssl"
          attr: "regex:(SSLContext|create_default_context)"
  message: |
    Python 3.10 ssl module has stricter security defaults (TLS 1.2 minimum).
  suggestion: |
    Test SSL connections after upgrading. Legacy servers may require explicit configuration.
  references:
    - "https://docs.python.org/3/whatsnew/3.10.html#ssl"

- id: "PY39SL22"
  name: "os.path.realpath() strict parameter"
  category: "new_feature"
  severity: "info"
  risk_level: "LOW"
  source_version: "3.9"
  target_version: "3.10"
  description: |
    os.path.realpath() strict parameter raises OSError if path doesn't exist
    or has symlink loops. Available in Python 3.10+.
  detector: "StdlibChangesDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Attribute"
        children:
          value:
            node_type: "Attribute"
            children:
              value:
                node_type: "Name"
                attributes:
                  id: "os"
              attr: "path"
          attr: "realpath"
      keywords:
        - node_type: "keyword"
          attributes:
            arg: "strict"
  message: |
    os.path.realpath(strict=True) parameter is not available in Python 3.9.
  suggestion: |
    For Python 3.9, manually check if path exists before calling realpath().
  references:
    - "https://docs.python.org/3/whatsnew/3.10.html#os-path"

- id: "PY39SL23"
  name: "typing.Literal behavior changes"
  category: "behavior_change"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.9"
  target_version: "3.10"
  description: |
    typing.Literal in Python 3.10 de-duplicates parameters, has order-independent
    equality, and correctly distinguishes types (e.g., Literal[0] != Literal[False]).
  detector: "BehaviorChangeDetector"
  pattern:
    node_type: "Subscript"
    children:
      value:
        node_type: "Attribute"
        children:
          value:
            node_type: "Name"
            attributes:
              id: "typing"
          attr: "Literal"
  message: |
    typing.Literal behavior changed in Python 3.10 (type-aware equality).
  suggestion: |
    Review Literal comparisons - Literal[0] != Literal[False] in Python 3.10.
  references:
    - "https://docs.python.org/3/whatsnew/3.10.html#typing"

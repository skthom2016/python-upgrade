# Standard library changes when upgrading from Python 3.9 to 3.10+

- id: "PY39SL01"
  name: "int.bit_count() method available"
  category: "new_feature"
  severity: "info"
  risk_level: "LOW"
  source_version: "3.9"
  target_version: "3.10"
  description: |
    int.bit_count() method returns the number of ones in the binary representation
    of the integer (population count). Available in Python 3.10+.
  detector: "StdlibChangesDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Attribute"
        attributes:
          attr: "bit_count"
  message: |
    int.bit_count() method is not available in Python 3.9.
  suggestion: |
    For Python 3.9, use: bin(n).count('1')
  examples:
    bad: "n.bit_count()"
    good: "bin(n).count('1')"
  references:
    - "https://docs.python.org/3/whatsnew/3.10.html#int"

- id: "PY39SL02"
  name: "zip() strict parameter available"
  category: "new_feature"
  severity: "info"
  risk_level: "LOW"
  source_version: "3.9"
  target_version: "3.10"
  description: |
    zip() function's strict parameter (PEP 618) raises ValueError if iterables
    have different lengths. Available in Python 3.10+.
  detector: "StdlibChangesDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Name"
        attributes:
          id: "zip"
      keywords:
        - node_type: "keyword"
          attributes:
            arg: "strict"
  message: |
    zip(strict=True) parameter is not available in Python 3.9.
  suggestion: |
    For Python 3.9, manually check lengths or use itertools.zip_longest().
  examples:
    bad: "zip(a, b, strict=True)"
    good: "# Check lengths manually in Python 3.9\nassert len(a) == len(b)\nzip(a, b)"
  references:
    - "https://docs.python.org/3/whatsnew/3.10.html#pep-618-add-optional-length-checking-to-zip"
    - "https://peps.python.org/pep-0618/"

- id: "PY39SL03"
  name: "itertools.pairwise() available"
  category: "new_feature"
  severity: "info"
  risk_level: "LOW"
  source_version: "3.9"
  target_version: "3.10"
  description: |
    itertools.pairwise() returns successive overlapping pairs from an iterable.
    Available in Python 3.10+.
  detector: "StdlibChangesDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Attribute"
        children:
          value:
            node_type: "Name"
            attributes:
              id: "itertools"
          attr: "pairwise"
  message: |
    itertools.pairwise() is not available in Python 3.9.
  suggestion: |
    For Python 3.9, use: zip(iterable, itertools.islice(iterable, 1, None))
  examples:
    bad: "itertools.pairwise('ABCDE')"
    good: "import itertools\nit = 'ABCDE'\nzip(it, itertools.islice(it, 1, None))"
  references:
    - "https://docs.python.org/3/whatsnew/3.10.html#itertools"

- id: "PY39SL04"
  name: "statistics module new functions"
  category: "new_feature"
  severity: "info"
  risk_level: "LOW"
  source_version: "3.9"
  target_version: "3.10"
  description: |
    statistics module adds covariance(), correlation(), and linear_regression()
    functions. Available in Python 3.10+.
  detector: "StdlibChangesDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Attribute"
        children:
          value:
            node_type: "Name"
            attributes:
              id: "statistics"
          attr: "regex:(covariance|correlation|linear_regression)"
  message: |
    statistics.{function}() is not available in Python 3.9.
  suggestion: |
    For Python 3.9, use numpy or scipy for statistical functions.
  examples:
    bad: "statistics.covariance(x, y)"
    good: "import numpy as np\nnp.cov(x, y)"
  references:
    - "https://docs.python.org/3/whatsnew/3.10.html#statistics"


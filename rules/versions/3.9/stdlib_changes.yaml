- id: "PY39SL12"
  name: "pathlib.Path.hardlink_to() available"
  category: "new_feature"
  severity: "info"
  risk_level: "LOW"
  source_version: "3.9"
  target_version: "3.10"
  description: |
    pathlib.Path.hardlink_to() creates a hard link. Available in Python 3.10+.
    Supersedes link_to() which is deprecated.
  detector: "StdlibChangesDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Attribute"
        attributes:
          attr: "hardlink_to"
  message: |
    pathlib.Path.hardlink_to() is not available in Python 3.9.
  suggestion: |
    For Python 3.9, use path.link_to() (deprecated) or os.link().
  examples:
    bad: "path.hardlink_to(target)"
    good: "import os\nos.link(target, path)"
  references:
    - "https://docs.python.org/3/whatsnew/3.10.html#pathlib"

- id: "PY39SL13"
  name: "pathlib.Path.parents slice support"
  category: "new_feature"
  severity: "info"
  risk_level: "LOW"
  source_version: "3.9"
  target_version: "3.10"
  description: |
    pathlib.Path.parents now supports slicing and negative indexing.
    Available in Python 3.10+.
  detector: "StdlibChangesDetector"
  pattern:
    node_type: "Subscript"
    children:
      value:
        node_type: "Attribute"
        attributes:
          attr: "parents"
      slice:
        node_type: "Slice"
  message: |
    Slicing pathlib.Path.parents is not available in Python 3.9.
  suggestion: |
    For Python 3.9, convert to list first: list(path.parents)[0:2]
  examples:
    bad: "path.parents[0:2]"
    good: "list(path.parents)[0:2]"
  references:
    - "https://docs.python.org/3/whatsnew/3.10.html#pathlib"


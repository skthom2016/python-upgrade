- id: PY36DF01
  name: Yield expressions in comprehensions deprecated
  category: deprecation
  severity: medium
  risk_level: MEDIUM
  source_version: '3.6'
  target_version: '3.8'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: 'Yield expressions (both ''yield'' and ''yield from'' clauses) are
    now

    deprecated in comprehensions and generator expressions (aside from the

    iterable expression in the leftmost ''for'' clause). In Python 3.7 these

    emit DeprecationWarning, in Python 3.8 this will be a SyntaxError.

    '
  detector: SyntaxChangesDetector
  pattern:
    node_type: ListComp
  condition:
    contains_yield: true
  message: 'Yield expressions in comprehensions are deprecated and will be a

    SyntaxError in Python 3.8+.

    '
  suggestion: 'Use a generator function or traditional for loop instead of yield

    in comprehensions.

    '
  examples:
    bad: '# Deprecated in 3.7, SyntaxError in 3.8

      [yield x for x in range(10)]

      {yield x for x in range(10)}

      '
    good: "# Use generator function instead\ndef gen():\n    for x in range(10):\n\
      \        yield x\nlist(gen())\n"
  references:
  - https://docs.python.org/3/whatsnew/3.7.html#deprecated-python-behavior
  - https://bugs.python.org/issue10544
- id: PY36DF02
  name: Returning complex subclass from __complex__() deprecated
  category: deprecation
  severity: low
  risk_level: LOW
  source_version: '3.6'
  target_version: '3.8'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: low
  description: 'Returning a subclass of complex from object.__complex__() is deprecated

    and will be an error in future Python versions. This makes __complex__()

    consistent with object.__int__() and object.__float__().

    '
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: FunctionDef
  condition:
    function_name: __complex__
    returns_subclass_of: complex
  message: 'Returning a subclass of complex from __complex__() is deprecated and

    will be an error in Python 3.8+.

    '
  suggestion: 'Return a complex instance instead of a subclass.

    '
  examples:
    bad: "class MyComplex(complex):\n    pass\n\nclass Number:\n    def __complex__(self):\n\
      \        return MyComplex(1+2j)\n"
    good: "class Number:\n    def __complex__(self):\n        return complex(1+2j)\n"
  references:
  - https://docs.python.org/3/whatsnew/3.7.html#deprecated-python-behavior
  - https://bugs.python.org/issue28894

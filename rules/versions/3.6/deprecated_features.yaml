  source_version: '3.6'
  target_version: '3.12'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: 'ssl.wrap_socket() is deprecated. Use ssl.SSLContext.wrap_socket()

    instead for better security and flexibility.

    '
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Attribute
        children:
          value:
            node_type: Name
            attributes:
              id: ssl
          attr: wrap_socket
  message: 'ssl.wrap_socket() is deprecated. Use ssl.SSLContext.wrap_socket()

    instead.

    '
  suggestion: 'Create an SSLContext with ssl.create_default_context() or

    ssl.SSLContext() and use its wrap_socket() method.

    '

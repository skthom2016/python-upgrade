- id: PY36DF04
  name: Direct await of asyncio.Lock deprecated
  category: deprecation
  severity: medium
  risk_level: MEDIUM
  source_version: '3.6'
  target_version: '3.9'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: 'Support for directly awaiting instances of asyncio.Lock and other

    asyncio synchronization primitives has been deprecated. An asynchronous

    context manager must be used instead.

    '
  detector: AsyncChangesDetector
  pattern:
    node_type: Await
  condition:
    awaits_sync_primitive: true
  message: 'Directly awaiting asyncio.Lock and other synchronization primitives is

    deprecated. Use async context manager instead.

    '
  suggestion: 'Use ''async with lock:'' instead of ''await lock''.

    '
  examples:
    bad: 'lock = asyncio.Lock()

      await lock  # Deprecated

      # ... do work ...

      lock.release()

      '
    good: "lock = asyncio.Lock()\nasync with lock:\n    # ... do work ...\n"
  references:
  - https://docs.python.org/3/library/asyncio-sync.html
  - https://bugs.python.org/issue32253

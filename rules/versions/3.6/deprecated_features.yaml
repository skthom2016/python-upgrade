  - https://bugs.python.org/issue25988
- id: PY36DF07
  name: dbm.dumb behavior change deprecation
  category: deprecation
  severity: low
  risk_level: LOW
  source_version: '3.6'
  target_version: '3.8'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: low
  description: 'dbm.dumb now supports reading read-only files and no longer writes
    the

    index file when it is not changed. A deprecation warning is emitted if

    the index file is missing and recreated in ''r'' and ''w'' modes.

    '
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Attribute
        attributes:
          attr: open
        children:
          value:
            node_type: Attribute
            attributes:
              attr: dumb
            children:
              value:
                node_type: Name
                attributes:
                  id: dbm
  condition:
    mode_is_read_or_write: true
  message: 'dbm.dumb behavior has changed for read-only files. Use ''r'' mode for

    reading and ''c'' for creating.

    '
  suggestion: 'Use ''c'' flag to create database, ''r'' flag to read existing database,

    ''w'' flag to write (will recreate if missing).

    '
  examples:
    bad: 'db = dbm.dumb.open(''file'', ''r'')  # May warn if index missing

      db = dbm.dumb.open(''file'', ''w'')  # May warn if index missing

      '
    good: 'db = dbm.dumb.open(''file'', ''c'')  # Create if needed

      db = dbm.dumb.open(''file'', ''r'')  # Read only, expects index

      '
  references:
  - https://docs.python.org/3/library/dbm.html#module-dbm.dumb
  - https://bugs.python.org/issue28847
- id: PY36DF08
  name: Non-Enum membership check deprecated
  category: deprecation
  severity: low
  risk_level: LOW
  source_version: '3.6'
  target_version: '3.8'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: low
  description: 'In Python 3.8, attempting to check for non-Enum objects in Enum classes

    will raise a TypeError. Currently returns False but is deprecated.

    '
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Compare
  condition:
    checking_non_enum_in_enum: true
  message: 'Checking for non-Enum objects in Enum classes is deprecated and will

    raise TypeError in Python 3.8+.

    '
  suggestion: 'Ensure you''re only comparing Enum members with Enum members, or use

    explicit type checking.

    '
  examples:
    bad: "from enum import Enum\nclass Color(Enum):\n    RED = 1\n\nif 1 in Color:\
      \  # Deprecated\n    pass\n"
    good: "from enum import Enum\nclass Color(Enum):\n    RED = 1\n\nif 1 in [e.value\
      \ for e in Color]:\n    pass\n"
  references:
  - https://docs.python.org/3/library/enum.html
  - https://bugs.python.org/issue33217

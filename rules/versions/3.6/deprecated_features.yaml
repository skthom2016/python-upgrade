  source_version: '3.6'
  target_version: '3.8'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: 'In Python 3.8, the abstract base classes in collections.abc will no

    longer be exposed in the regular collections module. Import from


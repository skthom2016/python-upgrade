    PyOS_AfterFork_Parent() or PyOS_AfterFork_Child() instead.

    '
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Str
  condition:
    contains: PyOS_AfterFork
  message: 'PyOS_AfterFork() is deprecated in the C API. Use the new fork-related

    functions instead.

    '
  suggestion: 'Update C extension code to use PyOS_BeforeFork(),

    PyOS_AfterFork_Parent() and PyOS_AfterFork_Child().

    '
  examples:
    bad: '/* C code */

      PyOS_AfterFork();

      '
    good: "/* C code */\nPyOS_BeforeFork();\npid = fork();\nif (pid == 0) {\n    PyOS_AfterFork_Child();\n\
      } else {\n    PyOS_AfterFork_Parent();\n}\n"
  references:

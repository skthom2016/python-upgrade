  source_version: '3.6'
  target_version: '3.9'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: low
  description: 'The silent argument value truncation in socket.htons() and

    socket.ntohs() has been deprecated. In future versions, passing

    arguments larger than 16 bits will raise an exception.

    '
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
  condition:
    func_is: regex:(socket.htons|socket.ntohs)
    argument_exceeds_16_bits: true
  message: 'Passing values > 16 bits to socket.htons() and socket.ntohs() is

    deprecated and will raise an exception in Python 3.9+.

    '
  suggestion: 'Ensure values passed to htons() and ntohs() are within 16-bit range

    (0-65535).

    '
  examples:

# Standard library changes when upgrading from Python 3.8 to 3.9+

- id: "PY38SL01"
  name: "xml.etree.ElementTree.getchildren() removed"
  category: "breaking_change"
  severity: "high"
  risk_level: "HIGH"
  source_version: "3.8"
  target_version: "3.9"
  description: |
    xml.etree.ElementTree.getchildren() and getiterator() were removed
    in Python 3.9.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Attribute"
        children:
          value:
            node_type: "Call"
          attr: "regex:(getchildren|getiterator)"
  message: |
    getchildren() and getiterator() were removed in Python 3.9.
  suggestion: |
    Use list(element) instead of getchildren() and element.iter() instead
    of getiterator().
  references:
    - "https://docs.python.org/3/whatsnew/3.9.html#removed"

- id: "PY38SL02"
  name: "New str.removeprefix() and removesuffix() methods"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.8"
  target_version: "3.9"
  description: |
    Python 3.9 adds str.removeprefix() and str.removesuffix() methods
    (PEP 616). Also available for bytes, bytearray, and collections.UserString.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    calls_method: "removeprefix|removesuffix"
  message: |
    str.removeprefix() and removesuffix() are not available in Python 3.8.
  suggestion: |
    For Python 3.8 compatibility, use string slicing or str.replace().
  examples:
    good: |
      # Python 3.9+
      "Hello World".removeprefix("Hello ")  # "World"
      "Hello World".removesuffix(" World")  # "Hello"
  references:
    - "https://docs.python.org/3/whatsnew/3.9.html#str-removeprefix-and-str-removesuffix"
    - "https://www.python.org/dev/peps/pep-0616/"

- id: "PY38SL03"
  name: "New zoneinfo module"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.8"
  target_version: "3.9"
  description: |
    Python 3.9 adds the zoneinfo module for IANA time zone database
    support (PEP 615).
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Import"
  condition:
    imports: "zoneinfo"
  message: |
    The zoneinfo module is not available in Python 3.8.
  suggestion: |
    For Python 3.8, use third-party packages like pytz or dateutil.
  examples:
    good: |
      # Python 3.9+
      from zoneinfo import ZoneInfo
      from datetime import datetime
      dt = datetime(2020, 10, 31, 12, tzinfo=ZoneInfo("America/Los_Angeles"))
  references:
    - "https://docs.python.org/3/whatsnew/3.9.html#zoneinfo"
    - "https://www.python.org/dev/peps/pep-0615/"

- id: "PY38SL04"
  name: "New graphlib module"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.8"
  target_version: "3.9"
  description: |
    Python 3.9 adds the graphlib module with TopologicalSorter class
    for topological sorting.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Import"
  condition:
    imports: "graphlib"
  message: |
    The graphlib module is not available in Python 3.8.
  suggestion: |
    For Python 3.8, implement your own topological sort or use third-party
    libraries.
  examples:
    good: |
      # Python 3.9+
      from graphlib import TopologicalSorter
      ts = TopologicalSorter()
      ts.add('a', 'b', 'c')
      list(ts.static_order())
  references:
    - "https://docs.python.org/3/whatsnew/3.9.html#graphlib"

- id: "PY38SL05"
  name: "New math.gcd() with multiple arguments"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.8"
  target_version: "3.9"
  description: |
    math.gcd() now accepts multiple arguments in Python 3.9.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "math.gcd"
    arg_count_greater_than: 2
  message: |
    math.gcd() with more than 2 arguments requires Python 3.9+.
  suggestion: |
    For Python 3.8, chain gcd calls: gcd(gcd(a, b), c).
  examples:
    good: |
      # Python 3.9+
      import math
      result = math.gcd(12, 18, 30)
  references:
    - "https://docs.python.org/3/whatsnew/3.9.html#math"


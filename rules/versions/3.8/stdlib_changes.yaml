- id: "PY38SL08"
  name: "New typing.Annotated type"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.8"
  target_version: "3.9"
  description: |
    Python 3.9 adds typing.Annotated (PEP 593) for adding metadata
    to type hints.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Subscript"
  condition:
    subscripts: "typing.Annotated"
  message: |
    typing.Annotated is not available in Python 3.8.
  suggestion: |
    For Python 3.8, use typing_extensions or avoid Annotated.
  examples:
    good: |
      # Python 3.9+
      from typing import Annotated
      def foo(x: Annotated[int, "positive"]) -> None:
          pass
  references:
    - "https://docs.python.org/3/whatsnew/3.9.html#typing"
    - "https://www.python.org/dev/peps/pep-0593/"

- id: "PY38SL09"
  name: "datetime.isocalendar() returns namedtuple"
  category: "api_change"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.8"
  target_version: "3.9"
  description: |
    datetime.isocalendar() now returns a namedtuple instead of a regular tuple.
  detector: "StdlibChangesDetector"
  pattern:
    node_type: "Call"
  condition:
    calls_method: "isocalendar"
  message: |
    datetime.isocalendar() returns namedtuple in Python 3.9+ (was tuple).
  suggestion: |
    Code that uses tuple unpacking or indexing continues to work, but
    code that checks type or uses isinstance may need updating.
  references:
    - "https://docs.python.org/3/whatsnew/3.9.html#datetime"

- id: "PY38SL10"
  name: "inspect.BoundArguments.arguments returns dict"
  category: "api_change"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.8"
  target_version: "3.9"
  description: |
    inspect.BoundArguments.arguments now returns a regular dict instead
    of OrderedDict.
  detector: "StdlibChangesDetector"
  pattern:
    node_type: "Attribute"
  condition:
    accesses: "BoundArguments.arguments"
  message: |
    inspect.BoundArguments.arguments returns dict in Python 3.9+.
  references:
    - "https://docs.python.org/3/whatsnew/3.9.html#inspect"

- id: PY38BC08
  name: __import__() now raises ImportError instead of ValueError
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.8'
  target_version: '3.9'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    __import__() now raises ImportError instead of ValueError for relative
    imports beyond the top-level package.
  detector: ExceptionChangesDetector
  pattern:
    node_type: ExceptHandler
  condition:
    catches: ValueError
    in_import_context: true
  message: |
    __import__() now raises ImportError instead of ValueError in Python 3.9.
  suggestion: |
    Change exception handling from ValueError to ImportError when catching
    errors from __import__() or importlib.util.resolve_name().
  examples:
    bad: |
      try:
          __import__('..module', fromlist=['name'])
      except ValueError:
          handle_error()
    good: |
      try:
          __import__('..module', fromlist=['name'])
      except ImportError:
          handle_error()
  references:
  - https://docs.python.org/3/whatsnew/3.9.html#changes-in-python-behavior
- id: PY38BC09
  name: Empty string replace behavior changed
  category: breaking_change
  severity: low
  risk_level: LOW
  source_version: '3.8'
  target_version: '3.9'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: low
  description: |
    ''.replace('', s, n) now returns s for non-zero n, instead of an
    empty string. The same applies to bytes and bytearray objects.
  detector: BehaviorChangesDetector
  pattern:
    node_type: Call
  condition:
    calls_method: replace
    on_string_type: true
  message: |
    Empty string replace behavior changed in Python 3.9.
  suggestion: |
    Review code that calls replace('', ...) on empty strings, as the
    behavior has changed.
  references:
  - https://docs.python.org/3/whatsnew/3.9.html#changes-in-python-behavior
- id: PY38BC10
  name: typing.NamedTuple._field_types removed
  category: breaking_change
  severity: low
  risk_level: LOW
  source_version: '3.8'
  target_version: '3.9'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: low
  description: |
    The typing.NamedTuple._field_types attribute has been removed.
    Use __annotations__ instead.
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Attribute
  condition:
    accesses_attribute: _field_types
    on_namedtuple: true
  message: |
    typing.NamedTuple._field_types was removed in Python 3.9.
    Use __annotations__ instead.
  suggestion: |
    Replace namedtuple._field_types with namedtuple.__annotations__.
  examples:
    bad: |
      from typing import NamedTuple
      class Point(NamedTuple):
          x: int
          y: int
      fields = Point._field_types
    good: |
      from typing import NamedTuple
      class Point(NamedTuple):
          x: int
          y: int
      fields = Point.__annotations__
  references:
  - https://docs.python.org/3/whatsnew/3.9.html#removed

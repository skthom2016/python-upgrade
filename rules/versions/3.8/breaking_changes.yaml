# Breaking changes when upgrading from Python 3.8 to 3.9+

- id: "PY3801"
  name: "collections.abc.ByteString moved"
  category: "breaking_change"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.8"
  target_version: "3.10"
  description: |
    collections.ByteString was moved to collections.abc.ByteString and
    the old name was removed in Python 3.10.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Attribute"
    children:
      value:
        node_type: "Name"
        attributes:
          id: "collections"
      attr: "ByteString"
  message: |
    collections.ByteString was removed in Python 3.10. Use
    collections.abc.ByteString instead.
  suggestion: |
    Change 'collections.ByteString' to 'collections.abc.ByteString'.
  examples:
    bad: |
      from collections import ByteString
    good: |
      from collections.abc import ByteString
  references:
    - "https://docs.python.org/3/whatsnew/3.10.html#removed"

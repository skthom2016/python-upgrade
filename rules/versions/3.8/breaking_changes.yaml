- id: PY38BC06
  name: base64.encodestring() and decodestring() removed
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.8'
  target_version: '3.9'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    base64.encodestring() and base64.decodestring() aliases have been
    removed. Use base64.encodebytes() and base64.decodebytes() instead.
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
  condition:
    func_is: base64\.(encodestring|decodestring)
  message: |
    base64.encodestring() and decodestring() were removed in Python 3.9.
    Use encodebytes() and decodebytes().
  suggestion: |
    Replace base64.encodestring() with base64.encodebytes() and
    base64.decodestring() with base64.decodebytes().
  examples:
    bad: |
      import base64
      encoded = base64.encodestring(data)
      decoded = base64.decodestring(encoded)
    good: |
      import base64
      encoded = base64.encodebytes(data)
      decoded = base64.decodebytes(encoded)
  references:
  - https://docs.python.org/3/whatsnew/3.9.html#removed

# Breaking Changes when upgrading from Python 3.8
# These changes will cause code to break or behave differently

- id: PY38BC01
  name: sys.getcheckinterval() and sys.setcheckinterval() removed
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.8'
  target_version: '3.9'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    sys.getcheckinterval() and sys.setcheckinterval() have been removed.
    Use sys.getswitchinterval() and sys.setswitchinterval() instead.
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
  condition:
    func_is: sys\.(getcheckinterval|setcheckinterval)
  message: |
    sys.getcheckinterval() and sys.setcheckinterval() were removed in
    Python 3.9. Use sys.getswitchinterval() and sys.setswitchinterval().
  suggestion: |
    Replace sys.getcheckinterval() with sys.getswitchinterval() and
    sys.setcheckinterval() with sys.setswitchinterval().
  examples:
    bad: |
      import sys
      interval = sys.getcheckinterval()
      sys.setcheckinterval(100)
    good: |
      import sys
      interval = sys.getswitchinterval()
      sys.setswitchinterval(0.001)  # Note: expects seconds, not opcodes
  references:
  - https://docs.python.org/3/whatsnew/3.9.html#removed
- id: PY38BC02
  name: _dummy_thread and dummy_threading modules removed
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.8'
  target_version: '3.9'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    The _dummy_thread and dummy_threading modules have been removed.
    These modules were deprecated since Python 2.7 and removed in 3.9.
  detector: ImportChangesDetector
  pattern:
    node_type: Import
  condition:
    imports: _dummy_thread|dummy_threading
  message: |
    _dummy_thread and dummy_threading modules were removed in Python 3.9.
  suggestion: |
    Use the threading module directly. These dummy modules are no longer
    needed as threading is always available.
  examples:
    bad: |
      import dummy_threading as threading
    good: |
      import threading
  references:
  - https://docs.python.org/3/whatsnew/3.9.html#removed
- id: PY38BC03
  name: threading.Thread.isAlive() removed
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.8'
  target_version: '3.9'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    The threading.Thread.isAlive() method has been removed.
    Use threading.Thread.is_alive() instead.
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
  condition:
    calls_method: isAlive
    on_thread_object: true
  message: |
    threading.Thread.isAlive() was removed in Python 3.9.
    Use is_alive() instead.
  suggestion: |
    Replace thread.isAlive() with thread.is_alive().
  examples:
    bad: |
      import threading
      t = threading.Thread(target=func)
      if t.isAlive():
          pass
    good: |
      import threading
      t = threading.Thread(target=func)
      if t.is_alive():
          pass
  references:
  - https://docs.python.org/3/whatsnew/3.9.html#removed
- id: PY38BC04
  name: ElementTree.getchildren() and getiterator() removed
  category: breaking_change
  severity: high
  risk_level: HIGH
  source_version: '3.8'
  target_version: '3.9'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: high
  description: |
    xml.etree.ElementTree methods getchildren() and getiterator() have
    been removed. Use list(element) and element.iter() instead.
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
  condition:
    calls_method: getchildren|getiterator
    on_element: true
  message: |
    ElementTree.getchildren() and getiterator() were removed in Python 3.9.
    Use list(element) and element.iter() instead.
  suggestion: |
    Replace element.getchildren() with list(element) and
    element.getiterator() with element.iter().
  examples:
    bad: |
      children = element.getchildren()
      iterator = element.getiterator()
    good: |
      children = list(element)
      iterator = element.iter()
  references:
  - https://docs.python.org/3/whatsnew/3.9.html#removed
- id: PY38BC05

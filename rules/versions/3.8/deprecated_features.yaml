- id: "PY38DF13"
  name: "Passing coroutines to asyncio.wait() deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.8"
  target_version: "3.11"
  description: |
    Passing coroutine objects directly to asyncio.wait() is deprecated.
    Wrap them in Tasks first.
  detector: "AsyncChangesDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "asyncio.wait"
    passes_coroutine: true
  message: |
    Passing coroutines directly to asyncio.wait() is deprecated.
  suggestion: |
    Wrap coroutines in asyncio.create_task() before passing to wait().
  examples:
    bad: |
      await asyncio.wait([coro1(), coro2()])
    good: |
      await asyncio.wait([asyncio.create_task(coro1()),
                          asyncio.create_task(coro2())])
  references:
    - "https://docs.python.org/3/whatsnew/3.9.html#deprecated"

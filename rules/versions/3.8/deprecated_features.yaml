- id: "PY38DF09"
  name: "ast deprecated classes (slice, Index, ExtSlice, Suite, Param)"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.8"
  target_version: "3.10"
  description: |
    AST classes slice, Index, ExtSlice, Suite, Param, AugLoad, and
    AugStore are deprecated and will be removed.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Name"
  condition:
    imported_from_ast: "slice|Index|ExtSlice|Suite|Param|AugLoad|AugStore"
  message: |
    This AST class is deprecated and will be removed.
  suggestion: |
    Use updated AST node types. Index(value) becomes value,
    ExtSlice(slices) becomes Tuple(slices, Load()).
  references:
    - "https://docs.python.org/3/whatsnew/3.9.html#deprecated"


# Deprecated features when upgrading from Python 3.8 to 3.9+

- id: "PY3810"
  name: "parser module deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.8"
  target_version: "3.10"
  description: |
    The 'parser' module was deprecated in Python 3.9 and removed in
    Python 3.10.
  detector: "DeprecatedImportsDetector"
  pattern:
    node_type: "Import"
    children:
      names:
        - node_type: "alias"
          attributes:
            name: "parser"
  message: |
    The 'parser' module was removed in Python 3.10. Use 'ast' instead.
  suggestion: |
    Replace 'import parser' with 'import ast'.
  references:
    - "https://docs.python.org/3/whatsnew/3.10.html#removed"

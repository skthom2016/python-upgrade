- id: "PY38DF03"
  name: "math.factorial() accepting float deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.8"
  target_version: "3.10"
  description: |
    Passing float instances to math.factorial() is deprecated and will
    raise TypeError in Python 3.10.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "math.factorial"
    has_float_argument: true
  message: |
    Passing float to math.factorial() is deprecated in Python 3.9.
  suggestion: |
    Convert float to int explicitly: math.factorial(int(x)).
  examples:
    bad: |
      import math
      result = math.factorial(5.0)
    good: |
      import math
      result = math.factorial(5)
      result = math.factorial(int(5.0))
  references:
    - "https://docs.python.org/3/whatsnew/3.9.html#deprecated"

- id: "PY38DF04"
  name: "NotImplemented in boolean context deprecated"
  category: "deprecation"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.8"
  target_version: "3.10"
  description: |
    Using NotImplemented in a boolean context has been deprecated.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Name"
  condition:
    id_is: "NotImplemented"
    in_boolean_context: true
  message: |
    Using NotImplemented in boolean context is deprecated in Python 3.9.
  suggestion: |
    Check explicitly for NotImplemented using 'is' or 'is not'.
  examples:
    bad: |
      result = some_op()
      if result:  # Bad if result can be NotImplemented
          use_result(result)
    good: |
      result = some_op()
      if result is not NotImplemented:
          use_result(result)
  references:
    - "https://docs.python.org/3/whatsnew/3.9.html#deprecated"

- id: "PY38DF05"
  name: "random module non-deterministic seed deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.8"
  target_version: "3.11"
  description: |
    The random module will restrict seeds to None, int, float, str, bytes,
    and bytearray in Python 3.11. Other types are deprecated.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "random.seed"
    has_non_deterministic_argument: true
  message: |
    Using non-deterministic hash types as random seeds is deprecated.
  suggestion: |
    Use None, int, float, str, bytes, or bytearray as seeds.
  references:
    - "https://docs.python.org/3/whatsnew/3.9.html#deprecated"

- id: "PY38DF06"
  name: "Opening GzipFile without mode deprecated"
  category: "deprecation"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.8"
  target_version: "3.10"
  description: |
    Opening GzipFile for writing without specifying mode is deprecated.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "gzip.GzipFile"
    missing_mode_argument: true
  message: |
    Opening GzipFile without specifying mode is deprecated.
  suggestion: |
    Specify the mode argument explicitly: gzip.GzipFile(filename, 'rb').
  examples:
    bad: |
      import gzip
      f = gzip.GzipFile('file.gz')
    good: |
      import gzip
      f = gzip.GzipFile('file.gz', 'rb')
  references:
    - "https://docs.python.org/3/whatsnew/3.9.html#deprecated"


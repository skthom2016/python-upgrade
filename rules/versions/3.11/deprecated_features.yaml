- id: "PY311DF08"
  name: "sqlite3 named placeholders with sequences deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.11"
  target_version: "3.12"
  description: |
    Using named placeholders with sequence parameters in sqlite3 is deprecated
    and will be removed in Python 3.14.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Attribute"
        attributes:
          attr: "execute"
  message: |
    Using named placeholders with sequence parameters in sqlite3 is deprecated.
  suggestion: |
    Use dictionary parameters for named placeholders: execute(sql, {'name': value}).
  examples:
    bad: "cursor.execute('SELECT * FROM users WHERE name = :name', ('Alice',))"
    good: "cursor.execute('SELECT * FROM users WHERE name = :name', {'name': 'Alice'})"
  references:
    - "https://docs.python.org/3/whatsnew/3.12.html#deprecated"

- id: "PY311DF09"
  name: "shutil.rmtree onerror parameter deprecated"
  category: "deprecation"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.11"
  target_version: "3.12"
  description: |
    shutil.rmtree() onerror parameter is deprecated and will be removed in 3.14.
    Use onexc parameter instead.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Attribute"
        children:
          value:
            node_type: "Name"
            attributes:
              id: "shutil"
          attr: "rmtree"
      keywords:
        - node_type: "keyword"
          attributes:
            arg: "onerror"
  message: |
    shutil.rmtree() onerror parameter is deprecated. Use onexc instead.
  suggestion: |
    Replace onerror with onexc. Note: onexc receives exception instance, not (type, value, tb).
  examples:
    bad: "shutil.rmtree(path, onerror=error_handler)"
    good: "shutil.rmtree(path, onexc=error_handler)"
  references:
    - "https://docs.python.org/3/whatsnew/3.12.html#deprecated"


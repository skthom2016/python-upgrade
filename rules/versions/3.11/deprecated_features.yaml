- id: "PY311DF03"
  name: "ast deprecated node classes"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.11"
  target_version: "3.12"
  description: |
    ast.Num, ast.Str, ast.Bytes, ast.NameConstant, and ast.Ellipsis are
    deprecated since Python 3.8 and will be removed in 3.14.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Attribute"
    children:
      value:
        node_type: "Name"
        attributes:
          id: "ast"
      attr: "regex:(Num|Str|Bytes|NameConstant|Ellipsis)"
  message: |
    ast node classes Num, Str, Bytes, NameConstant, Ellipsis are deprecated and will be removed in 3.14.
  suggestion: |
    Use ast.Constant instead for all constant values.
  examples:
    bad: "node = ast.Num(n=42)"
    good: "node = ast.Constant(value=42)"
  references:
    - "https://docs.python.org/3/whatsnew/3.12.html#deprecated"

- id: "PY311DF04"
  name: "asyncio.get_event_loop() deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.11"
  target_version: "3.12"
  description: |
    asyncio.get_event_loop() now emits DeprecationWarning when creating a new
    event loop implicitly. Will be removed in Python 3.14.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Attribute"
        children:
          value:
            node_type: "Name"
            attributes:
              id: "asyncio"
          attr: "get_event_loop"
  message: |
    asyncio.get_event_loop() is deprecated when creating new event loop implicitly.
  suggestion: |
    Use asyncio.new_event_loop() explicitly, or use asyncio.run() for simple cases.
  examples:
    bad: "loop = asyncio.get_event_loop()"
    good: "loop = asyncio.new_event_loop()\nasyncio.set_event_loop(loop)"
  references:
    - "https://docs.python.org/3/whatsnew/3.12.html#deprecated"


- id: "PY311DF18"
  name: "Bitwise inversion on bool deprecated"
  category: "deprecation"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.11"
  target_version: "3.12"
  description: |
    Bitwise inversion on bool (~True, ~False) is deprecated and will be
    removed in Python 3.16.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "UnaryOp"
    children:
      op:
        node_type: "Invert"
      operand:
        node_type: "Constant"
        attributes:
          value: "regex:(True|False)"
  message: |
    Bitwise inversion on bool (~True, ~False) is deprecated and will be removed in Python 3.16.
  suggestion: |
    Use 'not' operator or convert to int: not x or ~int(x)
  examples:
    bad: "result = ~True"
    good: "result = not True  # or ~int(True)"
  references:
    - "https://docs.python.org/3/whatsnew/3.12.html#deprecated"


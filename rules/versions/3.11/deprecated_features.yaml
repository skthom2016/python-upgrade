# Deprecated features when upgrading from Python 3.11 to 3.12+

# Pending Removal in Python 3.13 (PEP 594 modules)

- id: "PY311DF01"
  name: "datetime.utcnow() deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.11"
  target_version: "3.12"
  description: |
    datetime.utcnow() is deprecated in Python 3.12 and will be removed in 3.15.
    Use timezone-aware datetime instead.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Attribute"
        children:
          value:
            node_type: "Name"
            attributes:
              id: "datetime"
          attr: "utcnow"
  message: |
    datetime.utcnow() is deprecated in Python 3.12 and will be removed in 3.15.
  suggestion: |
    Use datetime.now(tz=datetime.UTC) instead for timezone-aware datetime.
  examples:
    bad: "now = datetime.utcnow()"
    good: "now = datetime.now(tz=datetime.UTC)"
  references:
    - "https://docs.python.org/3/whatsnew/3.12.html#deprecated"


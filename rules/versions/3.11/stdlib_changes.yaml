# Stdlib Changes when upgrading from Python 3.11
# Changes to modules, functions, and classes in the Python standard library

- id: PY311SL01
  name: asyncio eager task factory available
  category: new_feature
  severity: info
  risk_level: LOW
  source_version: '3.11'
  target_version: '3.12'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    asyncio.eager_task_factory() and create_eager_task_factory() enable
    eager task execution for 2-5x performance improvement in some cases.
  detector: NewAPIDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Attribute
        children:
          value:
            node_type: Name
            attributes:
              id: asyncio
          attr: regex:(eager_task_factory|create_eager_task_factory)
  message: |
    asyncio eager task factories are available in Python 3.12+.
  suggestion: |
    This feature provides significant performance improvements in Python 3.12.
  examples:
    bad: '# Not available in Python 3.11'
    good: asyncio.get_event_loop().set_task_factory(asyncio.eager_task_factory)
  references:
  - https://docs.python.org/3/whatsnew/3.12.html#asyncio

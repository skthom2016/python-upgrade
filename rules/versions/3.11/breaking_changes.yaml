- id: PY311BC11
  name: unittest TestCase deprecated aliases removed
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.11'
  target_version: '3.12'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    Long-deprecated unittest.TestCase method aliases were removed in Python 3.12.
    These include assertEquals, failUnless, failIf, etc.
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Attribute
        attributes:
          attr: regex:(assertEquals|assertNotEquals|assertAlmostEquals|assertNotAlmostEquals|assertRegexpMatches|assertRaisesRegexp|assertNotRegexpMatches)
  message: |
    unittest.TestCase deprecated method aliases were removed in Python 3.12.
  suggestion: |
    Use the standard method names: assertEquals→assertEqual, assertNotEquals→assertNotEqual,
    assertAlmostEquals→assertAlmostEqual, assertRegexpMatches→assertRegex.
  examples:
    bad: self.assertEquals(a, b)
    good: self.assertEqual(a, b)
  references:
  - https://docs.python.org/3/whatsnew/3.12.html#removed

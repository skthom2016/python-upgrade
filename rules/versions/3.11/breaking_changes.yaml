# Breaking Changes when upgrading from Python 3.11
# These changes will cause code to break or behave differently

- id: PY311BC01
  name: distutils module removed
  category: breaking_change
  severity: critical
  risk_level: HIGH
  source_version: '3.11'
  target_version: '3.12'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: critical
  description: |
    The distutils module was removed in Python 3.12 (PEP 632).
    It was deprecated since Python 3.10.
  detector: DeprecatedImportsDetector
  pattern:
    node_type: ImportFrom
    attributes:
      module: regex:distutils.*
  message: |
    The 'distutils' module was removed in Python 3.12 (PEP 632).
  suggestion: |
    Use setuptools for packaging tasks. For version parsing, use packaging.version.
  examples:
    bad: from distutils.core import setup
    good: from setuptools import setup
  references:
  - https://docs.python.org/3/whatsnew/3.12.html#removed
  - https://peps.python.org/pep-0632/
- id: PY311BC02
  name: imp module removed
  category: breaking_change
  severity: high
  risk_level: HIGH
  source_version: '3.11'
  target_version: '3.12'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: high
  description: |
    The imp module was removed in Python 3.12. It was deprecated since Python 3.4.
  detector: DeprecatedImportsDetector
  pattern:
    node_type: Import
    children:
      names:
      - node_type: alias
        attributes:
          name: imp
  message: |
    The 'imp' module was removed in Python 3.12.
  suggestion: |
    Use importlib module instead. See migration guide: imp.find_module() → importlib.util.find_spec(),
    imp.load_module() → importlib.import_module(), imp.reload() → importlib.reload().
  examples:
    bad: |-
      import imp
      mod = imp.load_module('name', *args)
    good: |-
      import importlib
      mod = importlib.import_module('name')
  references:
  - https://docs.python.org/3/whatsnew/3.12.html#removed
  - https://docs.python.org/3/library/importlib.html

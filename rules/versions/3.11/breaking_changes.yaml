- id: PY311BC06
  name: sqlite3.enable_shared_cache() removed
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.11'
  target_version: '3.12'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    sqlite3.enable_shared_cache() was removed in Python 3.12.
    Shared cache mode is discouraged by SQLite.
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Attribute
        children:
          value:
            node_type: Name
            attributes:
              id: sqlite3
          attr: enable_shared_cache
  message: |
    sqlite3.enable_shared_cache() was removed in Python 3.12.
  suggestion: |
    Remove calls to enable_shared_cache(). If needed, use URI filenames with shared cache mode.
  examples:
    bad: sqlite3.enable_shared_cache(True)
    good: conn = sqlite3.connect('file:path?cache=shared', uri=True)
  references:
  - https://docs.python.org/3/whatsnew/3.12.html#removed
  - https://www.sqlite.org/sharedcache.html

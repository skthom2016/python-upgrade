# Breaking changes when upgrading from Python 3.11 to 3.12+

- id: "PY31101"
  name: "distutils removed"
  category: "breaking_change"
  severity: "critical"
  risk_level: "HIGH"
  source_version: "3.11"
  target_version: "3.12"
  description: |
    The 'distutils' module was removed in Python 3.12.
  detector: "DeprecatedImportsDetector"
  pattern:
    node_type: "Import"
    children:
      names:
        - node_type: "alias"
          attributes:
            name: "distutils"
  message: |
    The 'distutils' module was removed in Python 3.12.
  suggestion: |
    Use setuptools for packaging tasks or packaging.version for version parsing.
  references:
    - "https://docs.python.org/3/whatsnew/3.12.html#removed"

- id: "PY31102"
  name: "typing.Text removed"
  category: "breaking_change"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.11"
  target_version: "3.12"
  description: |
    typing.Text was removed in Python 3.11. Use 'str' instead.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Attribute"
    children:
      value:
        node_type: "Name"
        attributes:
          id: "typing"
      attr: "Text"
  message: |
    typing.Text was removed. Use 'str' instead.
  suggestion: |
    Replace 'typing.Text' with 'str'.
  references:
    - "https://docs.python.org/3/whatsnew/3.11.html#removed"

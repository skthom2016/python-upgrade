- id: PY311BC19
  name: Escape sequence warnings upgraded
  category: breaking_change
  severity: low
  risk_level: LOW
  source_version: '3.11'
  target_version: '3.12'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: low
  description: |
    Invalid escape sequences in string literals now emit DeprecationWarning
    and will become SyntaxError in future versions.
  detector: SyntaxChangesDetector
  pattern:
    node_type: Constant
    attributes:
      value: regex:.*\\[^\\nrtbfv'"a0-7xuUN].*
  message: |
    Invalid escape sequences now emit DeprecationWarning in Python 3.12.
  suggestion: |
    Use raw strings (r"...") for regex patterns and paths, or use proper escape sequences.
  examples:
    bad: pattern = "\d+\.\d+"
    good: pattern = r"\d+\.\d+"
  references:
  - https://docs.python.org/3/whatsnew/3.12.html#other-language-changes
- id: PY311BC20
  name: Slices now hashable
  category: behavioral_change
  severity: info
  risk_level: LOW
  source_version: '3.11'
  target_version: '3.12'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    Slice objects are now hashable in Python 3.12, allowing them to be used
    as dictionary keys and in sets.
  detector: BehaviorChangeDetector
  pattern:
    node_type: Call
    children:
      func:
        node_type: Name
        attributes:
          id: slice
  message: |
    Slices are now hashable in Python 3.12.
  suggestion: |
    You can now use slices as dictionary keys: d = {slice(1, 5): "value"}
  references:
  - https://docs.python.org/3/whatsnew/3.12.html#other-language-changes

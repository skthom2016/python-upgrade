- id: PY37BC14
  name: asyncio.CancelledError inheritance changed
  category: breaking_change
  severity: high
  risk_level: HIGH
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: high
  description: |
    asyncio.CancelledError now inherits from BaseException instead of
    Exception. This means that except Exception clauses will no longer
    catch asyncio.CancelledError, which can change program behavior.
  detector: AsyncChangesDetector
  pattern:
    node_type: ExceptHandler
  condition:
    catches_exception: true
  message: |
    asyncio.CancelledError now inherits from BaseException in Python 3.8+.
    It will not be caught by 'except Exception' clauses.
  suggestion: |
    If you need to catch asyncio.CancelledError, add an explicit except
    clause for it before catching Exception, or catch BaseException.
  examples:
    bad: |
      try:
          await some_task()
      except Exception:
          # This will NOT catch CancelledError in Python 3.8+
          handle_error()
    good: |
      try:
          await some_task()
      except asyncio.CancelledError:
          handle_cancellation()
      except Exception:
          handle_error()
  references:
  - https://docs.python.org/3/library/asyncio-exceptions.html#asyncio.CancelledError
  - https://docs.python.org/3/whatsnew/3.8.html#asyncio
  - https://bugs.python.org/issue32528
- id: PY37BC15
  name: collections.namedtuple._asdict() returns dict
  category: breaking_change
  severity: low
  risk_level: LOW
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: low
  description: |
    collections.namedtuple()._asdict() now returns a regular dict instead
    of an OrderedDict. If you rely on the OrderedDict type, you need to
    explicitly convert.
  detector: StdlibChangesDetector
  pattern:
    node_type: Call
  condition:
    calls_method: _asdict
    on_namedtuple: true
  message: |
    namedtuple._asdict() returns a dict in Python 3.8+, not an OrderedDict.
  suggestion: |
    If you need OrderedDict specifically, wrap the result in OrderedDict().
  examples:
    bad: |
      from collections import namedtuple, OrderedDict
      Point = namedtuple('Point', 'x y')
      p = Point(1, 2)
      # Assumes OrderedDict type
      d = p._asdict()
      assert isinstance(d, OrderedDict)  # Fails in 3.8+
    good: |
      from collections import namedtuple, OrderedDict
      Point = namedtuple('Point', 'x y')
      p = Point(1, 2)
      d = OrderedDict(p._asdict())  # Explicit conversion
  references:
  - https://docs.python.org/3/library/collections.html#collections.namedtuple
  - https://docs.python.org/3/whatsnew/3.8.html#collections
  - https://bugs.python.org/issue35864
- id: PY37BC16
  name: math.factorial() no longer accepts non-int arguments
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    math.factorial() no longer accepts arguments that are not int-like.
    Passing float or Decimal will raise TypeError.
  detector: StdlibChangesDetector
  pattern:
    node_type: Call
  condition:
    func_is: math.factorial
  message: |
    math.factorial() no longer accepts non-int arguments in Python 3.8+.
  suggestion: |
    Convert arguments to int explicitly before calling math.factorial().
  examples:
    bad: |
      import math
      result = math.factorial(5.0)  # TypeError in 3.8+
    good: |
      import math
      result = math.factorial(int(5.0))
      result = math.factorial(5)
  references:
  - https://docs.python.org/3/library/math.html#math.factorial
  - https://docs.python.org/3/whatsnew/3.8.html#math
  - https://bugs.python.org/issue33083
- id: PY37BC17
  name: os.path boolean methods return False for bad paths
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    On Windows, os.path.isdir() no longer returns True for a link to a
    non-existent directory. Boolean-returning os.path functions
    (exists(), isdir(), isfile(), etc.) now return False instead of
    raising ValueError on bytes paths that contain unencodable characters.
  detector: StdlibChangesDetector
  pattern:
    node_type: Call
  condition:
    func_is: regex:(os\.path\.(exists|isdir|isfile|islink|ismount))
  message: |
    os.path boolean methods have changed behavior in Python 3.8 for
    edge cases on Windows and unencodable paths.
  suggestion: |
    Review error handling for os.path boolean functions. They now return
    False instead of raising exceptions for problematic paths.
  examples:
    bad: |
      import os
      # Python 3.7: raises ValueError on unencodable path
      # Python 3.8: returns False
      try:
          exists = os.path.exists(bad_path)
      except ValueError:
          exists = False
    good: |
      import os
      # Python 3.8+: just use the function directly
      exists = os.path.exists(path)
  references:
  - https://docs.python.org/3/library/os.path.html
  - https://docs.python.org/3/whatsnew/3.8.html#os-path
  - https://bugs.python.org/issue33721
- id: PY37BC18
  name: pathlib boolean methods return False for bad paths
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    pathlib.Path methods that return booleans (exists(), is_dir(),
    is_file(), etc.) now return False instead of raising ValueError
    on paths containing characters that are unencodable at the OS level.
  detector: StdlibChangesDetector
  pattern:
    node_type: Call
  condition:
    calls_method: regex:(exists|is_dir|is_file|is_symlink|is_socket|is_fifo|is_block_device|is_char_device)
    on_pathlib_path: true
  message: |
    pathlib.Path boolean methods have changed behavior in Python 3.8
    for unencodable paths.
  suggestion: |
    Review error handling for pathlib.Path boolean methods. They now
    return False instead of raising exceptions for problematic paths.
  examples:
    bad: |
      from pathlib import Path
      # Python 3.7: raises ValueError on unencodable path
      # Python 3.8: returns False
      try:
          exists = Path(bad_path).exists()
      except ValueError:
          exists = False
    good: |
      from pathlib import Path
      # Python 3.8+: just use the method directly
      exists = Path(path).exists()
  references:
  - https://docs.python.org/3/library/pathlib.html
  - https://docs.python.org/3/whatsnew/3.8.html#pathlib
  - https://bugs.python.org/issue33721

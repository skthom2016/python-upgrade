      import macpath
      path = macpath.join('a', 'b')
    good: |
      import os.path
      path = os.path.join('a', 'b')
  references:
  - https://docs.python.org/3/whatsnew/3.8.html#api-and-feature-removals
  - https://bugs.python.org/issue35471

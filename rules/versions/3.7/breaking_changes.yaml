- id: PY37BC06
  name: cgi parse_qs, parse_qsl, escape removed
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    parse_qs, parse_qsl, and escape are removed from the cgi module.
    They are deprecated in Python 3.2 or older. They should be imported
    from the urllib.parse and html modules instead.
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
  condition:
    func_is: regex:(cgi.parse_qs|cgi.parse_qsl|cgi.escape)
  message: |
    cgi.parse_qs(), cgi.parse_qsl(), and cgi.escape() were removed in Python 3.8.
    Use urllib.parse and html.escape instead.
  suggestion: |
    Replace cgi.parse_qs() with urllib.parse.parse_qs(),
    cgi.parse_qsl() with urllib.parse.parse_qsl(),
    and cgi.escape() with html.escape().
  examples:
    bad: |
      from cgi import parse_qs
      data = parse_qs(query_string)
    good: |
      from urllib.parse import parse_qs
      data = parse_qs(query_string)
  references:
  - https://docs.python.org/3/library/cgi.html
  - https://docs.python.org/3/whatsnew/3.8.html#api-and-feature-removals

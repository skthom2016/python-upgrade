# Breaking Changes when upgrading from Python 3.7
# These changes will cause code to break or behave differently

- id: PY37BC01
  name: Yield expressions in comprehensions become SyntaxError
  category: breaking_change
  severity: high
  risk_level: HIGH
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: high
  description: |
    Yield expressions (both 'yield' and 'yield from' clauses) are now
    disallowed in comprehensions and generator expressions (aside from the
    iterable expression in the leftmost 'for' clause). In Python 3.7 this was
    deprecated, in Python 3.8 it becomes a SyntaxError.
  detector: SyntaxErrorDetector
  pattern:
    node_type: ListComp
  condition:
    contains_yield: true
  message: |
    Yield expressions in comprehensions are now a SyntaxError in
    Python 3.8+. Use a generator function instead.
  suggestion: |
    Replace comprehensions with yield in them using generator functions.
  examples:
    bad: |
      # SyntaxError in Python 3.8+
      [yield x for x in range(10)]
      {yield x for x in range(10)}
    good: |
      # Use generator function instead
      def gen():
          for x in range(10):
              yield x
      list(gen())
  references:
  - https://docs.python.org/3/whatsnew/3.8.html#other-language-changes
  - https://bugs.python.org/issue10544
- id: PY37BC02
  name: macpath module removed
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    The macpath module, deprecated in Python 3.7, has been removed.
    Use os.path instead.
  detector: ImportChangesDetector
  pattern:
    node_type: Import
    children:
      names:
      - node_type: alias
        attributes:
          name: macpath
  message: |
    The macpath module was removed in Python 3.8. Use os.path instead.
  suggestion: |
    Replace 'import macpath' with 'import os.path' and use os.path functions.
  examples:

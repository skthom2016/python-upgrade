- id: PY37BC08
  name: XMLParser html argument removed
  category: breaking_change
  severity: medium
  risk_level: MEDIUM
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: ast
    confidence: high
    requires_llm: false
    priority: medium
  description: |
    The XMLParser constructor no longer accepts the html argument. It never
    had an effect and was deprecated in Python 3.4. All other parameters
    are now keyword-only.
  detector: DeprecatedAPIsDetector
  pattern:
    node_type: Call
  condition:
    func_is: xml.etree.ElementTree.XMLParser
    has_positional_args_beyond_first: true
  message: |
    The html argument of XMLParser was removed in Python 3.8.
    All parameters are now keyword-only.
  suggestion: |
    Update XMLParser calls to use only keyword arguments and remove the
    html parameter.
  examples:
    bad: |
      import xml.etree.ElementTree as ET
      parser = ET.XMLParser(target, True)
    good: |
      import xml.etree.ElementTree as ET
      parser = ET.XMLParser(target=target)
  references:
  - https://docs.python.org/3/whatsnew/3.8.html#api-and-feature-removals
  - https://bugs.python.org/issue29209

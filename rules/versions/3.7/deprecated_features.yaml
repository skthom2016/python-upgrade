- id: "PY37DF17"
  name: "asyncio.loop.set_default_executor() with non-ThreadPoolExecutor deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    Using loop.set_default_executor() with any executor that is not an
    instance of ThreadPoolExecutor is deprecated and will be prohibited
    in Python 3.9.
  detector: "AsyncChangesDetector"
  pattern:
    node_type: "Call"
  condition:
    calls_method: "set_default_executor"
    on_asyncio_loop: true
  message: |
    Setting a default executor that is not a ThreadPoolExecutor is
    deprecated and will be prohibited in Python 3.9.
  suggestion: |
    Use ThreadPoolExecutor as the default executor.
  examples:
    bad: |
      from concurrent.futures import ProcessPoolExecutor
      loop.set_default_executor(ProcessPoolExecutor())  # Deprecated
    good: |
      from concurrent.futures import ThreadPoolExecutor
      loop.set_default_executor(ThreadPoolExecutor())
  references:
    - "https://docs.python.org/3/library/asyncio-eventloop.html#asyncio.loop.set_default_executor"
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue34075"

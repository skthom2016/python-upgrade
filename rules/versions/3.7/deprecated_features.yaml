- id: "PY37DF13"
  name: "asyncio.wait() coroutine objects deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.11"
  description: |
    The explicit passing of coroutine objects to asyncio.wait() has been
    deprecated and will be removed in version 3.11.
  detector: "AsyncChangesDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "asyncio.wait"
    passes_coroutine_object: true
  message: |
    Passing coroutine objects to asyncio.wait() is deprecated and will be
    removed in Python 3.11. Pass tasks or awaitables instead.
  suggestion: |
    Create tasks first with asyncio.create_task() or use asyncio.gather()
    instead of passing coroutines to wait().
  examples:
    bad: |
      await asyncio.wait([coro1, coro2])
    good: |
      await asyncio.gather(coro1, coro2)
      await asyncio.wait([task1, task2])
  references:
    - "https://docs.python.org/3/library/asyncio-sync.html#asyncio.wait"
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue34790"

- id: "PY37DF14"
  name: "xml.dom.pulldom.DOMEventStream.__getitem__() deprecated"
  category: "deprecation"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    Deprecated usage of xml.dom.pulldom.DOMEventStream.__getitem__().
    Prefer iteration protocol instead.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Subscript"
  condition:
    subscripts_object_type: "xml.dom.pulldom.DOMEventStream"
  message: |
    xml.dom.pulldom.DOMEventStream.__getitem__() is deprecated.
    Use iteration instead.
  suggestion: |
    Use iteration protocol (for loop) instead of indexing.
  examples:
    bad: |
      from xml.dom.pulldom import parse
      events = parse('file.xml')
      event = events[0]  # Deprecated
    good: |
      from xml.dom.pulldom import parse
      events = parse('file.xml')
      for event, node in events:
          process(event, node)
  references:
    - "https://docs.python.org/3/library/xml.dom.pulldom.html"
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue34898"


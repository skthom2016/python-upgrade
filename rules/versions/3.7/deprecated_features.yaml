# Deprecated features when upgrading from Python 3.7 to 3.8+

- id: "PY37DF01"
  name: "getchildren() and getiterator() deprecated in ElementTree"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    Deprecated methods getchildren() and getiterator() in the
    ElementTree module now emit a DeprecationWarning instead of
    PendingDeprecationWarning. They will be removed in Python 3.9.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "regex:(getchildren|getiterator)"
    on_elementtree_object: true
  message: |
    getchildren() and getiterator() are deprecated and will be removed in
    Python 3.9. Use list() and iter() instead.
  suggestion: |
    Replace .getchildren() with list(element) and .getiterator() with
    element.iter() or iter(element).
  examples:
    bad: |
      children = element.getchildren()
      iterator = element.getiterator()
    good: |
      children = list(element)
      iterator = iter(element)
  references:
    - "https://docs.python.org/3/library/xml.etree.elementtree.html"
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue29209"

- id: "PY37DF02"
  name: "@asyncio.coroutine decorator deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.10"
  description: |
    The @asyncio.coroutine decorator is deprecated and will be removed in
    version 3.10. Use async def instead.
  detector: "AsyncChangesDetector"
  pattern:
    node_type: "FunctionDef"
  condition:
    has_decorator: "asyncio.coroutine"
  message: |
    The @asyncio.coroutine decorator is deprecated and will be removed in
    Python 3.10. Use 'async def' syntax instead.
  suggestion: |
    Replace @asyncio.coroutine def with async def, and replace yield from
    with await.
  examples:
    bad: |
      @asyncio.coroutine
      def my_coroutine():
          yield from asyncio.sleep(1)
    good: |
      async def my_coroutine():
          await asyncio.sleep(1)
  references:
    - "https://docs.python.org/3/library/asyncio-task.html#asyncio.coroutine"
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue36921"

- id: "PY37DF03"
  name: "asyncio loop parameter deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.10"
  description: |
    The explicit passing of a loop argument has been deprecated and will be
    removed in version 3.10 for the following: asyncio.sleep(),
    asyncio.gather(), asyncio.shield(), asyncio.wait_for(),
    asyncio.wait(), asyncio.as_completed(), asyncio.Task,
    asyncio.Lock, asyncio.Event, asyncio.Condition,
    asyncio.Semaphore, asyncio.Queue,
    asyncio.create_subprocess_exec(), and
    asyncio.create_subprocess_shell().
  detector: "AsyncChangesDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "regex:(asyncio\\.sleep|asyncio\\.gather|asyncio\\.shield|asyncio\\.wait_for|asyncio\\.wait|asyncio\\.as_completed|asyncio\\.Task\\(|asyncio\\.Lock\\(|asyncio\\.Event\\(|asyncio\\.Condition\\(|asyncio\\.Semaphore\\(|asyncio\\.Queue\\(|asyncio\\.create_subprocess_exec\\(|asyncio\\.create_subprocess_shell\\()"
    has_kwarg: "loop"
  message: |
    Explicit loop argument in asyncio functions is deprecated and will be
    removed in Python 3.10.
  suggestion: |
    Remove the 'loop' parameter from asyncio function calls and rely on
    the running event loop instead.
  examples:
    bad: |
      await asyncio.sleep(1, loop=loop)
      asyncio.run(main(), loop=loop)
    good: |
      await asyncio.sleep(1)
      asyncio.run(main())
  references:
    - "https://docs.python.org/3/library/asyncio-task.html"
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue34790"

- id: "PY37DF04"
  name: "typing.NamedTuple._field_types deprecated"
  category: "deprecation"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    The typing.NamedTuple class has deprecated the _field_types attribute
    in favor of the __annotations__ attribute which has the same information.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
  condition:
    accesses_attribute: "_field_types"
    on_namedtuple: true
  message: |
    typing.NamedTuple._field_types is deprecated. Use __annotations__
    instead.
  suggestion: |
    Replace namedtuple._field_types with namedtuple.__annotations__.
  examples:
    bad: |
      from typing import NamedTuple
      Point = NamedTuple('Point', [('x', int), ('y', int)])
      field_names = Point._field_types
    good: |
      from typing import NamedTuple
      Point = NamedTuple('Point', [('x', int), ('y', int)])
      field_names = Point.__annotations__
  references:
    - "https://docs.python.org/3/library/typing.html#typing.NamedTuple"
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue36320"

- id: "PY37DF05"
  name: "ast classes Num, Str, Bytes, NameConstant, Ellipsis deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    ast classes Num, Str, Bytes, NameConstant and Ellipsis are considered
    deprecated and will be removed in future Python versions. Constant
    should be used instead.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Str"
  condition:
    contains: "ast.Num|ast.Str|ast.Bytes|ast.NameConstant|ast.Ellipsis"
  message: |
    AST classes Num, Str, Bytes, NameConstant, and Ellipsis are deprecated.
    Use ast.Constant instead.
  suggestion: |
    Update AST visitors to use ast.Constant instead of the deprecated
    classes.
  examples:
    bad: |
      import ast
      class MyVisitor(ast.NodeVisitor):
          def visit_Num(self, node):
              print(f"Number: {node.n}")
          def visit_Str(self, node):
              print(f"String: {node.s}")
    good: |
      import ast
      class MyVisitor(ast.NodeVisitor):
          def visit_Constant(self, node):
              print(f"Constant: {node.value}")
  references:
    - "https://docs.python.org/3/library/ast.html#ast.Constant"
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue32892"

- id: "PY37DF06"
  name: "ast.NodeVisitor visit_Num, visit_Str, etc. deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    ast.NodeVisitor methods visit_Num(), visit_Str(), visit_Bytes(),
    visit_NameConstant(), and visit_Ellipsis() are deprecated now and will
    not be called in future Python versions. Add visit_Constant() to
    handle all constant nodes.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "FunctionDef"
  condition:
    has_visitor_method: "regex:(visit_Num|visit_Str|visit_Bytes|visit_NameConstant|visit_Ellipsis)"
  message: |
    AST visitor methods for deprecated AST node types are deprecated.
    Add visit_Constant() to handle all constant nodes instead.
  suggestion: |
    Add visit_Constant() method to handle all constants, and remove the
    deprecated visitor methods.
  examples:
    bad: |
      import ast
      class MyVisitor(ast.NodeVisitor):
          def visit_Num(self, node):
              print(f"Number: {node.n}")
          def visit_Str(self, node):
              print(f"String: {node.s}")
    good: |
      import ast
      class MyVisitor(ast.NodeVisitor):
          def visit_Constant(self, node):
              print(f"Constant: {node.value}")
  references:
    - "https://docs.python.org/3/ast.html#ast.NodeVisitor"
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue36917"

- id: "PY37DF07"
  name: "lgettext() and related functions deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    The following functions in the gettext module are deprecated:
    lgettext(), ldgettext(), lngettext(), ldngettext(). They return
    encoded bytes, and it's possible that you will get unexpected
    Unicode-related exceptions if there are encoding problems with the
    translated strings.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "regex:(gettext\\.lgettext|gettext\\.ldgettext|gettext\\.lngettext|gettext\\.ldngettext)"
  message: |
    gettext.lgettext() and related functions are deprecated. They return
    encoded bytes. Use gettext.gettext() instead.
  suggestion: |
    Replace lgettext() and variants with gettext.gettext() or
    ngettext() for plural forms.
  examples:
    bad: |
      import gettext
      msg = gettext.lgettext('message')
    good: |
      import gettext
      msg = gettext.gettext('message')
  references:
    - "https://docs.python.org/3/library/gettext.html"
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue33710"

- id: "PY37DF08"
  name: "gettext bind_textdomain_codeset() deprecated"
  category: "deprecation"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    Function bind_textdomain_codeset(), methods
    NullTranslations.output_charset() and
    NullTranslations.set_output_charset(), and the codeset parameter
    of functions translation() and install() are also deprecated,
    since they are only used for the l*gettext() functions.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "regex:(gettext\\.bind_textdomain_codeset|gettext\\.NullTranslations\\.output_charset|gettext\\.NullTranslations\\.set_output_charset|gettext\\.translation\\(.*codeset|gettext\\.install\\(.*codeset)"
  message: |
    gettext bind_textdomain_codeset() and related functions are deprecated.
    These are only used for the deprecated l*gettext() functions.
  suggestion: |
    Remove calls to bind_textdomain_codeset() and related functions.
    Use gettext.gettext() instead.
  examples:
    bad: |
      import gettext
      gettext.bind_textdomain_codeset('UTF-8')
  references:
    - "https://docs.python.org/3/library/gettext.html"
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue33710"

- id: "PY37DF09"
  name: "threading.Thread.isAlive() deprecated"
  category: "deprecation"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    The isAlive() method of threading.Thread has been deprecated.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
    children:
      func:
        node_type: "Attribute"
        children:
          value:
            node_type: "Name"
            attributes:
              id: "thread"
          attr: "isAlive"
  message: |
    threading.Thread.isAlive() is deprecated. Use is_alive() instead.
  suggestion: |
    Replace thread.isAlive() with thread.is_alive().
  examples:
    bad: |
      import threading
      thread = threading.Thread()
      if thread.isAlive():
          pass
    good: |
      import threading
      thread = threading.Thread()
      if thread.is_alive():
          pass
  references:
    - "https://docs.python.org/3/library/threading.html#thread-Thread.is_alive"
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue35283"

- id: "PY37DF10"
  name: "int() and related functions deprecate Decimal/Fraction"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    Many builtin and extension functions that take integer arguments will
    now emit a deprecation warning for Decimals, Fractions and any other
    objects that can be converted to integers only with a loss (e.g. that have
    the __int__() method but do not have the __index__() method). In
    future versions they will be errors.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
  condition:
    argument_type_is_float_or_decimal: true
    func_accepts_only_integers: true
  message: |
    Passing Decimal or Fraction to functions that expect integers is
    deprecated in Python 3.8+. Use int() conversion first.
  suggestion: |
    Convert Decimal or Fraction to int explicitly before passing to
    integer-only functions.
  examples:
    bad: |
      from decimal import Decimal
      n = Decimal('10')
      os.open('file', n, flags=os.O_CREAT)  # Deprecated
    good: |
      from decimal import Decimal
      n = Decimal('10')
      os.open('file', int(n), flags=os.O_CREAT)
  references:
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue36048"

- id: "PY37DF11"
  name: "Keyword arguments becoming positional-only (第一批)"
  category: "deprecation"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    Deprecated passing the following arguments as keyword arguments:
    - func in functools.partialmethod(), weakref.finalize(),
      profile.Profile.runcall(), cProfile.Profile.runcall(),
      bdb.Bdb.runcall(), trace.Trace.runfunc() and
      curses.wrapper().
    - function in unittest.TestCase.addCleanup().
    - fn in concurrent.futures.ThreadPoolExecutor and
      concurrent.futures.ProcessPoolExecutor.submit().
    - callback in contextlib.ExitStack.callback(),
      contextlib.AsyncExitStack.callback() and
      contextlib.AsyncExitStack.push_async_callback().
    - c and typeid in multiprocessing.managers.Server and
      multiprocessing.managers.SharedMemoryServer.create().
    - obj in weakref.finalize().

    In future releases of Python, they will be positional-only.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is_one_of: "regex:(functools\\.partialmethod|weakref\\.finalize|profile\\.Profile\\.runcall|cProfile\\.Profile\\.runcall|bdb\\.Bdb\\.runcall|trace\\.Trace\\.runfunc|curses\\.wrapper)"
    has_kwarg_one_of: "func|function|fn|callback|c|typeid|obj"
  message: |
    Keyword argument will become positional-only in Python 3.9+.
  suggestion: |
    Convert keyword argument to positional argument.
  examples:
    bad: |
      functools.partialmethod(func, func=my_func)
      unittest.TestCase.addCleanup(cleanup, 'arg')
      concurrent.futures.ThreadPoolExecutor.submit(task, fn=callback)
  references:
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue36492"

- id: "PY37DF12"
  name: "distutils bdist_wininst command deprecated"

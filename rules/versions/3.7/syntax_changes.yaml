# Syntax Changes when upgrading from Python 3.7
# New syntax features and breaking syntax changes

- id: PY37SC01
  name: Assignment expressions (walrus operator) available
  category: new_feature
  severity: info
  risk_level: INFO
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    The walrus operator := (assignment expressions) is not available in
    Python 3.7. It was introduced in Python 3.8 via PEP 572.
    Assignment expressions allow assigning values within larger expressions,
    reducing redundant function calls and improving readability.
  detector: SyntaxChangesDetector
  pattern:
    node_type: NamedExpr
  message: |
    Assignment expressions (:=) are not available in Python 3.7.
    This code requires Python 3.8+.
  suggestion: |
    If you need to support Python 3.7, refactor code to avoid using
    the walrus operator.
  examples:
    bad: |
      # Python 3.7: SyntaxError
      if (n := len(a)) > 10:
          print(f"List is too long ({n} elements)")
    good: |
      # Python 3.7 compatible
      n = len(a)
      if n > 10:
          print(f"List is too long ({n} elements)")
  references:
  - https://docs.python.org/3/whatsnew/3.8.html#assignment-expressions
  - https://www.python.org/dev/peps/pep-0572/
- id: PY37SC02
  name: Positional-only parameters available
  category: new_feature
  severity: info
  risk_level: INFO
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    PEP 570 introduced positional-only parameters using the / syntax.
    Parameters before / can only be passed positionally, not as keyword
    arguments. This was not available in Python 3.7.
  detector: SyntaxChangesDetector
  pattern:
    node_type: FunctionDef
  condition:
    has_posonlyargs: true
  message: |
    Positional-only parameters (/) are not available in Python 3.7.
    This code requires Python 3.8+.
  suggestion: |
    If you need to support Python 3.7, remove the / marker and accept
    that parameters can be passed as keyword arguments.
  examples:
    bad: |
      # Python 3.7: SyntaxError
      def f(a, b, /, c, d, *, e, f):
          print(a, b, c, d, e, f)
    good: |
      # Python 3.7 compatible (but allows keyword args)
      def f(a, b, c, d, *, e, f):
          print(a, b, c, d, e, f)
  references:
  - https://docs.python.org/3/whatsnew/3.8.html#positional-only-parameters
  - https://www.python.org/dev/peps/pep-0570/
- id: PY37SC03
  name: f-string = specifier available
  category: new_feature
  severity: info
  risk_level: INFO
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    Python 3.8 added the = specifier for f-strings to support self-documenting
    expressions for debugging. The syntax f'{expr=}' expands to show both
    the expression text and its value.
  detector: SyntaxChangesDetector
  pattern:
    node_type: JoinedStr
  condition:
    contains_debug_specifier: true
  message: |
    f-string = specifier for debugging is not available in Python 3.7.
    This code requires Python 3.8+.
  suggestion: |
    If you need to support Python 3.7, manually format the debug output.
  examples:
    bad: |
      # Python 3.7: SyntaxError
      user = 'eric_idle'
      member_since = date(1975, 7, 31)
      print(f'{user=} {member_since=}')
    good: |
      # Python 3.7 compatible
      user = 'eric_idle'
      member_since = date(1975, 7, 31)
      print(f'user={user!r} member_since={member_since!r}')
  references:
  - https://docs.python.org/3/whatsnew/3.8.html#f-strings-support-for-self-documenting-expressions-and-debugging
  - https://bugs.python.org/issue36817
- id: PY37SC04
  name: continue in finally clause allowed
  category: syntax_change
  severity: info
  risk_level: INFO
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    In Python 3.7 and earlier, using 'continue' in a finally clause was
    illegal and raised SyntaxError. Python 3.8 removed this restriction.
  detector: SyntaxChangesDetector
  pattern:
    node_type: Continue
  condition:
    inside_finally_clause: true
  message: |
    'continue' in finally clause is not allowed in Python 3.7.
    This code requires Python 3.8+.
  suggestion: |
    If you need to support Python 3.7, refactor to avoid using continue
    in finally blocks.
  examples:
    bad: |
      # Python 3.7: SyntaxError
      for i in range(10):
          try:
              do_something(i)
          finally:
              if should_skip(i):
                  continue  # SyntaxError in 3.7
    good: |
      # Python 3.7 compatible
      for i in range(10):
          if should_skip(i):
              continue
          try:
              do_something(i)
          finally:
              cleanup()
  references:
  - https://docs.python.org/3/whatsnew/3.8.html#other-language-changes
  - https://bugs.python.org/issue32489
- id: PY37SC05
  name: Generalized iterable unpacking in yield and return
  category: syntax_change
  severity: info
  risk_level: INFO
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    Python 3.8 allows generalized iterable unpacking in yield and return
    statements without requiring enclosing parentheses. In Python 3.7,
    you needed parentheses for unpacking with *.
  detector: SyntaxChangesDetector
  pattern:
    node_type: Return
  condition:
    has_unparenthesized_starred_unpacking: true
  message: |
    Generalized unpacking in return/yield without parentheses is not
    available in Python 3.7. This code requires Python 3.8+.
  suggestion: |
    If you need to support Python 3.7, add parentheses around the unpacking.
  examples:
    bad: |
      # Python 3.7: may require parentheses
      def parse(family):
          lastname, *members = family.split()
          return lastname.upper(), *members  # Needs () in 3.7
    good: |
      # Python 3.7 compatible
      def parse(family):
          lastname, *members = family.split()
          return (lastname.upper(), *members)
  references:
  - https://docs.python.org/3/whatsnew/3.8.html#other-language-changes
  - https://bugs.python.org/issue32117
- id: PY37SC06
  name: |2-

    {name} escapes supported in regular expressions
  category: new_feature
  severity: info
  risk_level: INFO
  source_version: '3.7'
  target_version: '3.8'
  detection:
    strategy: info_only
    confidence: null
    requires_llm: false
    priority: info
  description: |
    Python 3.8 added support for \N{name} Unicode named character escapes
    in regular expression patterns. This was not supported in Python 3.7.
  detector: SyntaxChangesDetector
  pattern:
    node_type: Call
  condition:
    func_is: re.compile
    pattern_contains_unicode_name_escape: true
  message: |
    \N{name} escapes in regular expressions are not available in Python 3.7.
    This code requires Python 3.8+.
  suggestion: |
    If you need to support Python 3.7, use Unicode escape sequences
    (\uXXXX or \UXXXXXXXX) or literal Unicode characters instead.
  examples:
    bad: |
      # Python 3.7: not supported
      import re
      pattern = re.compile(r'\N{LATIN CAPITAL LETTER A}')
    good: |
      # Python 3.7 compatible
      import re
      pattern = re.compile(r'A')  # or r'\u0041'
  references:
  - https://docs.python.org/3/whatsnew/3.8.html#other-language-changes
  - https://bugs.python.org/issue30688

- id: "PY37SL07"
  name: "New functools.cached_property decorator"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds functools.cached_property() decorator for computed
    properties cached for the life of the instance.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "FunctionDef"
  condition:
    has_decorator: "cached_property"
    is_in_functools_module
  message: |
    The functools.cached_property decorator is new in Python 3.8. This code will
    not work in Python 3.7.
  suggestion: |
    If you need to support Python 3.7, use a custom property with caching or
    third-party libraries.
  examples:
    good: |
      # Python 3.8+
      import functools
      class Dataset:
          def __init__(self, sequence_of_numbers):
              self.data = sequence_of_numbers

          @functools.cached_property
          def variance(self):
              return statistics.variance(self.data)
  references:
    - "https://docs.python.org/3/library/functools.html#functools.cached_property"
    - "https://bugs.python.org/issue21145"

- id: "PY37SL08"
  name: "New functools.singledispatchmethod decorator"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds functools.singledispatchmethod() decorator that converts
    methods into generic functions using single dispatch.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "FunctionDef"
  condition:
    has_decorator: "singledispatchmethod"
    is_in_functools_module
  message: |
    The functools.singledispatchmethod() decorator is new in Python 3.8. This code
    will not work in Python 3.7.
  suggestion: |
    If you need to support Python 3.7, use @functools.singledispatch with a
    third-party library or manual dispatch logic.
  examples:
    good: |
      # Python 3.8+
      import functools
      from functools import singledispatchmethod

      class TaskManager:
          def __init__(self, tasks):
              self.tasks = list(tasks)

          @singledispatchmethod
          def discard(self, value):
              with suppress(ValueError):
                  self.tasks.remove(value)

          @discard.register(list)
          def _(self, tasks):
              targets = set(tasks)
              self.tasks = [x for x in self.tasks if x not in targets]
  references:
    - "https://docs.python.org/3/library/functools.html#functools.singledispatchmethod"
    - "https://bugs.python.org/issue32380"


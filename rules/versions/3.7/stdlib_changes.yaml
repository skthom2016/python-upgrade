# --- ASYNCIO ADDITIONS (targeting 3.8) ---

- id: "PY37SL34"
  name: "asyncio.run() graduates to stable API"
  category: "api_change"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 graduates asyncio.run() from the provisional to stable API.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "asyncio.run"
  message: |
    asyncio.run() is now stable API in Python 3.8. Previously provisional.
  suggestion: |
    Use asyncio.run() as the preferred way to run asyncio programs.
  examples:
    good: |
      # Python 3.8+
      import asyncio

      async def main():
          await asyncio.sleep(0)
          return 42

      asyncio.run(main())
  references:
    - "https://docs.python.org/3/library/asyncio-task.html#asyncio.run"
    - "https://bugs.python.org/issue32314"

- id: "PY37SL35"
  name: "asyncio REPL (python -m asyncio)"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds natively async REPL with 'python -m asyncio'.
  This allows rapid experimentation with code that has a top-level await.
  detector: "CommandUsageDetector"
  pattern:
    node_type: "Str"
  condition:
    contains: "python -m asyncio"
  message: |
    The 'python -m asyncio' REPL is new in Python 3.8.
  suggestion: |
    Use 'python -m asyncio' to launch an async REPL for interactive testing with
    await expressions.
  examples:
    good: |
      # In terminal:
      python -m asyncio
      await asyncio.sleep(1, result='hello')
  references:
    - "https://docs.python.org/3/library/asyncio-task.html#asyncio.run"
    - "https://bugs.python.org/issue37028"

- id: "PY37SL36"
  name: "asyncio.Task.get_coro() added"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds asyncio.Task.get_coro() for getting the wrapped coroutine
    within an asyncio.Task.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "asyncio.Task.get_coro"
  message: |
    asyncio.Task.get_coro() is new in Python 3.8. This code will not work
    in Python 3.7.
  suggestion: |
    If you need to Python 3.7, use task._coro instead or keep your own
    reference.
  examples:
    good: |
      # Python 3.8+
      import asyncio

      task = asyncio.create_task(coro())
      coro = task.get_coro()  # Get back the wrapped coroutine
  references:
    - "https://docs.python.org/3/library/asyncio-task.html#asyncio.Task.get_coro"
    - "https://bugs.python.org/issue36999"

- id: "PY37SL37"
  name: "asyncio.Task naming support"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds support for task naming: asyncio.create_task(name='task_name',
    loop) or loop.create_task(name='task_name'), and
    task.set_name(), task.get_name().
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    is_asyncio_task_method: "regex:(create_task|set_name|get_name)"
  message: |
    AsyncIO task naming is new in Python 3.8. This code will not work
    in Python 3.7.
  suggestion: |
    If you need to support Python 3.7, keep your own task references or use
    the _coro attribute instead.
  examples:
    good: |
      # Python 3.8+
      import asyncio

      task = asyncio.create_task(coro, name='my_task')
      print(task.get_name())  # 'my_task'
  references:
    - "https://docs.python.org/3/library/asyncio-task.html#asyncio.Task"
    - "https://bugs.python.org/issue34270"


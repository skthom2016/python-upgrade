    - "https://docs.python.org/3/whatsnew/3.8.html#unittest"

- id: "PY37SL65"
  name: "New shlex.join() function"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds shlex.join() as the inverse of shlex.split().
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "shlex.join"
  message: |
    shlex.join() is new in Python 3.8.
  references:
    - "https://docs.python.org/3/whatsnew/3.8.html#shlex"

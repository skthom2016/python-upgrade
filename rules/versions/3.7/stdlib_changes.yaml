  pattern:
    node_type: "Call"
  condition:
    func_is: "os.path.realpath"
  message: |
    os.path.realpath() behavior changed in Python 3.8 on Windows - now
    resolves reparse points including directory junctions.
  suggestion: |
    Be aware that os.path.realpath() now correctly resolves directory junctions
    in Python 3.8+ on Windows.
  examples:

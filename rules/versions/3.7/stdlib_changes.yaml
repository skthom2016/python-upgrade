# --- UNITTEST ADDITIONS ---

- id: "PY37SL14"
  name: "unittest.AsyncMock added"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds AsyncMock to support an asynchronous version of Mock.
    Appropriate new assert functions for testing have been added as well.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "unittest.mock.AsyncMock"
  message: |
    unittest.mock.AsyncMock is new in Python 3.8. This code will not
    work in Python 3.7.
  suggestion: |
    If you need to support Python 3.7, use Mock with AsyncMockMixin or create
    your own async mock.
  examples:
    good: |
      # Python 3.8+
      from unittest.mock import AsyncMock
      async def my_test():
          mock = AsyncMock()
          await mock.some_async_method()
  references:
    - "https://docs.python.org/3/library/unittest.mock.html#unittest.mock.AsyncMock"
    - "https://bugs.python.org/issue26467"

- id: "PY37SL15"
  name: "unittest addModuleCleanup and addClassCleanup"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds addModuleCleanup() and addClassCleanup() to unittest
    to support cleanups for setUpModule() and setUpClass().
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "regex:(unittest\\.addModuleCleanup|unittest\\.addClassCleanup)"
  message: |
    unittest.addModuleCleanup() and addClassCleanup() are new in Python 3.8.
  examples:
    good: |
      # Python 3.8+
      import unittest

      class TestModule(unittest.TestCase):
          @classmethod
      def setUpModule(cls):
              cls.resource = cls.get_resource()

          @classmethod
      def tearDownModule(cls):
              cls.resource.close()

          @classmethod
      def addCleanup(cls):
              cls.resource.close()

      class TestClass(unittest.TestCase):
          @classmethod
          def setUpClass(cls):
              cls.conn = create_connection()

          @classmethod
          def tearDownClass(cls):
              cls.conn.close()

          @classmethod
          def addCleanup(cls):
              cls.conn.close()
  references:
    - "https://docs.python.org/3/library/unittest.html#unittest.addModuleCleanup"
    - "https://docs.python.org/3/library/unittest.html#unittest.addClassCleanup"
    - "https://bugs.python.org/issue24412"

- id: "PY37SL16"
  name: "unittest.IsolatedAsyncioTestCase added"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds unittest.IsolatedAsyncioTestCase to support coroutines
    to be used as test cases with async def setUp/tearDown methods.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "ClassDef"
  condition:
    inherits_from: "unittest.IsolatedAsyncioTestCase"
  message: |
    unittest.IsolatedAsyncioTestCase is new in Python 3.8. This code will not
    work in Python 3.7.
  suggestion: |
    If you need to support Python 3.7, use TestCase with
    @asyncio.coroutine or create your own async test infrastructure.
  examples:
    good: |
      # Python 3.8+
      import unittest

      class TestRequest(unittest.IsolatedAsyncioTestCase):

          async def asyncSetUp(self):
              self.connection = await AsyncConnection()

          async def asyncTest_get(self):
              response = await self.connection.get("https://example.com")
              self.assertEqual(response.status_code, 200)

          async def asyncTearDown(self):
              await self.connection.close()
  references:
    - "https://docs.python.org/3/library/unittest.html#unittest.IsolatedAsyncioTestCase"
    - "https://bugs.python.org/issue32972"

# --- FUNCTOOLS & COLLECTIONS ---

- id: "PY37SL17"
  name: "functools.lru_cache() can be used as decorator"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 allows functools.lru_cache() to be used as a straight decorator
    rather than as a function returning a decorator.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "FunctionDef"
  condition:
    has_decorator: "lru_cache"
    is_in_functools_module
  message: |
    Using @lru_cache() as a decorator directly is new in Python 3.8. This code
    will not work in Python 3.7.
  suggestion: |
    If you need to support Python 3.7, use @lru_cache(maxsize=128) instead.
  examples:
    good: |
      # Python 3.8+
      import functools

      @functools.lru_cache
      def factorial(n):
      return n * factorial(n-1) if n else 1
  references:
    - "https://docs.python.org/3/library/functools.html#functools.lru_cache"
    - "https://bugs.python.org/issue36772"

- id: "PY37SL18"
  name: "collections.namedtuple() supports default values"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.7 adds support for default values in collections.namedtuple().
  Python 3.8 further allows default values.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "collections.namedtuple"
    has_default_values: true
  message: |
    Default values in collections.namedtuple() are new in Python 3.8. This code
    will not work in Python 3.7.
  suggestion: |
    If you need to support Python 3.7, use defaults via inheritance or a helper
    function instead.
  examples:
    good: |
      # Python 3.8+
      from collections import namedtuple
      Point = namedtuple('Point', [('x', float), ('y', float), ('z', float)],
                       defaults=(0.0, 0.0, 0.0))
      p = Point()  # Creates Point(0.0, 0.0, 0.0)
  references:
    - "https://docs.python.org/3/library/collections.html#collections.namedtuple"
    - "https://bugs.python.org/issue32320"

- id: "PY37SL19"
  name: "collections.namedtuple._asdict() returns dict instead of OrderedDict"
  category: "api_change"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    The _asdict() method for collections.namedtuple() now returns a dict instead of a
    collections.OrderedDict. This works because regular dicts have guaranteed
    ordering since Python 3.7.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "_asdict"
    on_namedtuple
  message: |
    collections.namedtuple._asdict() now returns dict in Python 3.8 instead of
    OrderedDict.
  suggestion: |
    If you need OrderedDict features, cast the result: OrderedDict(nt._asdict()).
  examples:
    good: |
      # Python 3.8+
      from collections import namedtuple
      Point = namedtuple('Point', [('x', int), ('y', int)])
      p = Point(1, 2)
      result = p._asdict()  # dict in 3.8

      # For OrderedDict features:
      from collections import OrderedDict, namedtuple
      Point = namedtuple('Point', [('x', int), ('y', int)])
      p = Point(1, 2)
      result = OrderedDict(p._asdict())
  references:
    - "https://docs.python.org/3/library/collections.html#collections.namedtuple._asdict"
    - "https://bugs.python.org/issue35864"

- id: "PY37SL20"
  name: "csv.DictReader returns dict instead of OrderedDict"
  category: "api_change"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    The csv.DictReader now returns instances of dict instead of
    collections.OrderedDict. The tool is now faster and uses less
    memory while still preserving the field order.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "csv.DictReader"
  message: |
    csv.DictReader now returns dict instead of OrderedDict in Python 3.8.
  suggestion: |
    If you need OrderedDict behavior, cast the result to OrderedDict().
  examples:
    good: |
      # Python 3.8+
      import csv
      with open('data.csv') as f:
          reader = csv.DictReader(f)
          for row in reader:
              # row is now a dict, not OrderedDict
              print(row)
  references:
    - "https://docs.python.org/3/library/csv.html#csv.DictReader"
    - "https://bugs.python.org/issue34003"

# --- TYPING MODULE ADDITIONS ---

- id: "PY37SL21"
  name: "typing.TypedDict added"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds typing.TypedDict for dictionary types with per-key types.
  See PEP 589.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "ClassDef"
  condition:
    has_base: "typing.TypedDict"
  message: |
    typing.TypedDict is new in Python 3.8. This code will not work in Python 3.7.
  suggestion: |
    If you need to support Python 3.7, use dict with explicit type checking or
    third-party libraries like mypy or pyright.
  examples:
    good: |
      # Python 3.8+
      from typing import TypedDict

      class Location(TypedDict):
          lat_long: tuple
          grid_square: str
          xy_coordinate: tuple

      loc = Location(lat_long=(1.0, 2.0), grid_square="A1")
  references:
    - "https://docs.python.org/3/library/typing.html#typing.TypedDict"
    - "https://peps.python.org/pep-0589/"

- id: "PY37SL22"
  name: "typing.Literal added"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"

    USERPROFILE environment variable and does not use HOME.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "os.path.expanduser"
  message: |
    os.path.expanduser() behavior changed on Windows in Python 3.8 to prefer
    USERPROFILE over HOME.
  suggestion: |
    Be aware that os.path.expanduser() may behave differently on Windows 3.8+ if

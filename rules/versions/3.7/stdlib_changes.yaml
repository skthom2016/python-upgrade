    - "https://docs.python.org/3/library/os.path.html#os.path.expanduser"
    - "https://bugs.python.org/issue36264"

- id: "PY37SL42"
  name: "os.path.realpath() resolves reparse points on Windows"
  category: "api_change"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 changes os.path.realpath() on Windows to resolve reparse points,
    including symlinks and directory junctions.

      real_path = os.path.realpath('junction_path')
  references:
    - "https://docs.python.org/3/os.path.html#os.path.realpath"
    - "https://bugs.python.org/issue37834"

- id: "PY37SL43"
  name: "pathlib.Path.is_mount() on POSIX"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.7 adds pathlib.Path.is_mount() method on POSIX systems and can be
    used to determine whether a path is a mount point.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "pathlib.Path.is_mount"
  message: |
    pathlib.Path.is_mount() is new in Python 3.7 on POSIX systems. This code
    will not work in Python 3.6.
  suggestion: |
    If you need to support Python 3.6, use os.path.ismount() instead.
  examples:
    good: |
      # Python 3.7+
      from pathlib import Path
      if Path('/mnt/data').is_mount():
          print("Is a mount point")
  references:
    - "https://docs.python.org/3/library/pathlib.html#pathlib.Path.is_mount"
    - "https://bugs.python.org/issue30897"

- id: "PY37SL44"
  name: "xml.dom.minidom and xml.sax no external entities by default"
  category: "security_change"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    As mitigation against DTD and external entity retrieval, the
    xml.dom.minidom and xml.sax modules no longer process external
    entities by default in Python 3.8.
  detector: "SecurityChangesDetector"
  pattern:
    node_type: "ImportFrom"
  children:
      module:
        node_type: "str"
        value: "regex:(xml\\.dom\\.minidom|xml\\.sax)"
  message: |
    xml.dom.minidom and xml.sax no longer process external entities by default in
    Python 3.8+. This is a security enhancement.
  suggestion: |
    If you need external entities, explicitly enable them. Be aware of the
    security implications.
  examples:
    good: |
      # Python 3.8+
      import xml.dom.minidom
      doc = xml.dom.minidom.parse('file.xml')
      # To explicitly enable (not recommended for untrusted input):
      parser = xml.sax.make_parser()
      parser.setFeature(feature_external_ges=True)
  references:
    - "https://docs.python.org/3/whatsnew/3.8.html#xml"
    - "https://bugs.python.org/issue17239"

- id: "PY37SL45"
  name: "urllib.parse strips newlines and tabs from URLs"
  category: "security_change"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 changes urllib.parse() to prevent attacks using newline
    characters in URLs. ASCII newline \n, \r and tab \t characters are
    stripped from the URL.
  description: |
    Due to significant security concerns, the presence of newline or tab
    characters in parts of a URL allows for some forms of attacks. Following
    WHATWG specification that updates RFC 3986, ASCII newline \n, \r and tab \t characters
    are stripped from the URL by the parser in urllib.parse preventing such attacks.
  detector: "SecurityChangesDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is_one_of: "urllib.parse.parse_qs|urllib.parse.parse_qsl|urllib.parse.urlparse"
    has_newline_or_tab: true
  message: |
    urllib.parse() and related functions now strip newlines and tabs from URLs in
    Python 3.8+. This is a security enhancement.
  suggestion: |
    Be aware that URLs with newlines/tabs may be truncated. Use proper URL
    encoding.
  examples:
    good: |
      import urllib.parse
      result = urllib.parse("file.py\n\r")  # Newline and tab are stripped
  references:
    - "https://docs.python.org/3/urllib.parse.html"
    - "https://bugs.python.org/issue43882"
    - "https://github.com/python/cpython/pull/gh-88048"

- id: "PY37SL46"
  name: "unittest addModuleCleanup and addClassCleanup added"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds addModuleCleanup() and addClassCleanup() methods to
    unittest to support cleanups for setUpModule() and setUpClass().
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is_one_of: "unittest\\.addModuleCleanup|unittest\\.addClassCleanup"
  message: |
    unittest.addModuleCleanup() and addClassCleanup() are new in Python 3.8.
  examples:
    good: |
      # Python 3.8+
      import unittest

      class TestModule(unittest.TestCase):
          @classmethod
          def setUpModule(cls):
              cls.resource = cls.get_resource()

          @classmethod
          def tearDownModule(cls):
              cls.resource.close()

          @classmethod
          def addCleanup(cls):
              cls.resource.close()

      class TestClass(unittest.TestCase):
          @classmethod
          def setUpClass(cls):
              cls.conn = create_connection()

          @classmethod
          def tearDownClass(cls):
              cls.conn.close()

          @classmethod
          def addCleanup(cls):
              cls.conn.close()
  references:
    - "https://docs.python.org/3/library/unittest.html#unittest.addModuleCleanup"
    - "https://docs.python.org/3/library/unittest.html#unittest.addClassCleanup"
    - "https://bugs.python.org/issue24412"

# --- API CHANGES ---

- id: "PY37SL47"
  name: "asyncio.CancelledError inherits from BaseException"
  category: "api_change"
  severity: "high"
  risk_level: "HIGH"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    The exception asyncio.CancelledError now inherits from BaseException rather than
    Exception and no longer inherits from concurrent.futures.CancelledError.
  detector: "APIChangeDetector"
  pattern:
    node_type: "ClassDef"
  condition:
    inherits_from: "asyncio.CancelledError"
  message: |
    asyncio.CancelledError now inherits from BaseException in Python 3.8+, not
    Exception. This changes exception handling behavior.
  suggestion: |
    Update exception handling code to catch BaseException instead of Exception
    if appropriate, specifically for CancelledError.
  examples:
    bad: |
      # In Python 3.7, CancelledError inherits from Exception
      try:
          task.run()
      except Exception as e:
          pass
    good: |
      # In Python 3.8+, CancelledError inherits from BaseException
      try:
          task.run()
      except BaseException as e:
          pass
  references:
    - "https://docs.python.org/3/library/asyncio-exception.html#asyncio.CancelledError"
    - "https://docs.python.org/3/whatsnew/3.8.html#asyncio"
    - "https://bugs.python.org/issue32528"

- id: "PY37SL48"
  name: "asyncio.wait_for() timeout behavior change"
  category: "api_change"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    The function asyncio.wait_for() now correctly waits for cancellation when using
    an instance of asyncio.Task. Previously, upon reaching timeout,
    it was cancelled and immediately returned.
  detector: "APIChangeDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "asyncio.wait_for"
    passes_task_object: true
  message: |
    asyncio.wait_for() now correctly waits for Task cancellation in
    Python 3.8+. Previously it returned immediately on timeout.
  suggestion: |
    Ensure your code handles TaskCancellationException correctly.
  references:
    - "https://docs.python.org/3/library/asyncio-sync.html#asyncio.wait_for"
    - "https://bugs.python.org/issue32751"

- id: "PY37SL49"
  name: "mmap.flush() behavior change"
  category: "api_change"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    The mmap.flush() method now returns None on success and raises an
    exception on error under all platforms.
    Previously, behavior was platform-dependent.
  detector: "APIChangeDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "mmap.flush"
  message: |
    mmap.flush() now returns None on success and raises exception on error in
    Python 3.8+. Previously returned nonzero on success (Windows) or zero on error
    (Unix).
  suggestion: |
    Update mmap.flush() calls to expect None return value and proper
    exception handling.
  references:
    - "https://docs.python.org/3/library/mmap.html#mmap.flush"
    - "https://bugs.python.org/issue2122"

- id: "PY37SL50"
  name: "collections ABC import changes"
  category: "breaking_change"
  severity: "high"
  risk_level: "HIGH"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Starting with Python 3.3, importing ABCs from collections was deprecated,
    and importing should be done from collections.abc instead. Being able to import
    from collections was marked for removal in 3.8. This was delayed to 3.9.
    However, Python 3.7 code using collections ABCs should still work with a
    DeprecationWarning.
  detector: "ImportChangesDetector"
  pattern:
    node_type: "ImportFrom"
    children:
      module:
        node_type: "str"
        value: "collections"
      names:
        - node_type: "alias"
          attributes:
            name: "regex:(Callable|Iterator|Collection|Mapping|MutableMapping|Sequence|MutableSet)"
  message: |
    Importing ABCs from collections is deprecated in Python 3.8+. This will be
    removed in Python 3.9. Use collections.abc instead.
  suggestion: |
    Replace 'from collections import' with 'from collections.abc import'.
  examples:
    bad: |
      from collections import Callable
      from collections import Iterator
    good: |
      from collections.abc import Callable
      from collections.abc import Iterator
  references:
    - "https://docs.python.org/3/library/collections.html#collections.abc"
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue25988"

- id: "PY37SL51"
  name: "dict comprehension key order change"
  category: "api_change"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Dict comprehensions are synced-up with dict literals so that the key is
    computed first and the value second. This is important for
    assignment expressions where variables assigned in the key expression will be
    available in the value expression.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "DictComp"
  condition:
    has_dict_comprehension_with_assignment_expr_in_key
  message: |
    In Python 3.8, dict comprehensions compute key before value. This
    changes behavior for code using assignment expressions.
  suggestion: |
    Verify your dict comprehension still works correctly, especially with
    assignment expressions.
  examples:
    good: |
      # Python 3.8+ (key is computed first, then value)
      {(n := normalize('NFC', name)).casefold(): n for name in names}

      # For backward compatibility (all versions):
      {n.casefold() for n in names if (clean_name := normalize('NFC', n))}
  references:
    - "https://docs.python.org/3/whatsnew/3.8.html#other-language-changes"
    - "https://bugs.python.org/issue35224"

- id: "PY37SL52"
  name: "ast classes Num, Str, Bytes, NameConstant, Ellipsis deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    ast classes Num, Str, Bytes, NameConstant, and Ellipsis are considered
    deprecated and will be removed in future Python versions.
    Constant should be used instead.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "ClassDef"
  condition:
    has_base_class: "regex:(ast\\.Num|ast\\.Str|ast\\.Bytes|ast\\.NameConstant|ast\\.Ellipsis)"
  message: |
    AST classes Num, Str, Bytes, NameConstant, and Ellipsis are deprecated in
    Python 3.8+. Use ast.Constant instead.
  suggestion: |
    Update AST visitors to use ast.Constant instead of the deprecated
    classes.
  examples:
    bad: |
      import ast
      class MyVisitor(ast.NodeVisitor):
          def visit_Num(self, node):
              print(f"Number: {node.n}")
          def visit_Str(self, node):
              print(f"String: {node.s}")
    good: |
      import ast
      class MyVisitor(ast.NodeVisitor):
          def visit_Constant(self, node):
              print(f"Constant: {node.value}")
  references:
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue32892"

- id: "PY37SL53"
  name: "ast.NodeVisitor visit_Num, visit_Str, etc. deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    ast.NodeVisitor methods visit_Num(), visit_Str(), visit_Bytes(),
    visit_NameConstant(), and visit_Ellipsis() are deprecated now and will
    not be called in future Python versions.
  Add visit_Constant() to handle all constant nodes instead.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "FunctionDef"
  condition:
    has_visitor_method: "regex:(visit_Num|visit_Str|visit_Bytes|visit_NameConstant|visit_Ellipsis)"
  message: |
    AST visitor methods for deprecated AST node types are deprecated.
    Add visit_Constant() to handle all constant nodes instead.
  suggestion: |
    Add visit_Constant() method to handle all constants, and remove the
    deprecated visitor methods.
  examples:
    bad: |
      import ast
      class MyVisitor(ast.NodeVisitor):
          def visit_Num(self, node):
              print(f"Number: {node.n}")
          def visit_Str(self, node):
              print(f"String: {node.s}")
    good: |
      import ast
      class MyVisitor(ast.NodeVisitor):
          def visit_Constant(self, node):
              print(f"Constant: {node.value}")
  references:
    - "https://docs.python.org/3/ast.html#ast.NodeVisitor"
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue36917"

- id: "PY37SL54"
  name: "Decimal and Fraction deprecation in int() functions"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    Many builtin and extension functions that take integer arguments will now emit a
    deprecation warning for Decimals, Fractions and any other objects that can be
    converted to integers only with a loss.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
  condition:
    argument_type_is_float_or_decimal: true
    func_accepts_only_integers: true
  message: |
    Passing Decimal or Fraction to functions that expect integers is deprecated
    in Python 3.8+. Use int() conversion first.
  suggestion: |
    Convert Decimal or Fraction to int explicitly before passing to
    integer-only functions.
  examples:
    bad: |
      from decimal import Decimal
      n = Decimal('10')
      os.open('file', n, flags=os.O_CREAT)  # Deprecated
    good: |
      from decimal import Decimal
      n = Decimal('10')
      os.open('file', int(n), flags=os.O_CREAT)
  references:
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue36048"

- id: "PY37SL55"
  name: "Keyword arguments becoming positional-only"
  category: "deprecation"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.7"
  target_version: "3.9"
  description: |
    Deprecated passing the following arguments as keyword arguments:
    - func in functools.partialmethod(), weakref.finalize(),
      profile.Profile.runcall(), cProfile.Profile.runcall(),
      bdb.Bdb.runcall(), trace.Trace.runfunc() and
      curses.wrapper().
    - function in unittest.TestCase.addCleanup().
    - fn in concurrent.futures.ThreadPoolExecutor and
      concurrent.futures.ProcessPoolExecutor.submit().
    - callback in contextlib.ExitStack.callback(),
      contextlib.AsyncExitStack.callback() and
      contextlib.AsyncExitStack.push_async_callback().
    - c and typeid in multiprocessing.managers.Server and
      multiprocessing.managers.SharedMemoryServer.create().
    - obj in weakref.finalize().

    In future releases of Python, they will be positional-only.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
  condition:
    has_positional_kwarg_becoming_positional_only: true
  message: |
    Keyword argument will become positional-only in Python 3.9+.
  suggestion: |
    Convert keyword argument to positional argument.
  examples:
    bad: |
      functools.partialmethod(func, func=my_func)
      unittest.TestCase.addCleanup(cleanup, 'arg')
      concurrent.futures.ThreadPoolExecutor.submit(task, fn=callback)
  references:
    - "https://docs.python.org/3/whatsnew/3.8.html#deprecated"
    - "https://bugs.python.org/issue36492"

- id: "PY37SL56"
  name: "platform.dist() and linux_distribution() deprecated"
  category: "deprecation"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    The platform.dist() and platform.linux_distribution() functions were deprecated
    in Python 3.5 and removed in Python 3.8. Use the 'distro' package
    instead.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "regex:(platform\\.dist|platform\\.linux_distribution)"
  message: |
    platform.dist() and platform.linux_distribution() are deprecated and
    removed in Python 3.8. Use 'distro' package instead.
  suggestion: |
    Install and use the 'distro' package: pip install distro
  examples:
    bad: |
      import platform
      distro_info = platform.linux_distribution()
    good: |
      import distro
      distro_info = distro.linux_distribution()
  references:
    - "https://docs.python.org/3/library/platform.html#platform.linux_distribution"
    - "https://docs.python.org/3/whatsnew/3.8.html#removed"
    - "https://bugs.python.org/issue35471"

- id: "PY37SL57"
  name: "time.clock() and platform.popen() removed"
  category: "breaking_change"
  severity: "high"
  risk_level: "HIGH"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    The time.clock() and platform.popen() functions have been removed.
    time.clock() was deprecated since 3.3 and platform.popen() since 3.3.
  detector: "DeprecatedAPIsDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is_one_of: "time\\.clock|platform\\.popen"
  message: |
    time.clock() and platform.popen() were removed in Python 3.8.
  suggestion: |
    Replace time.clock() with time.perf_counter() or time.process_time().
    Replace platform.popen() with os.popen().
  examples:
    bad: |
      start = time.clock()  # Removed
      stream = platform.popen('command')  # Removed
    good: |
      start = time.perf_counter()
      stream = os.popen('command')
  references:
    - "https://docs.python.org/3/library/time.html#time.clock"
    - "https://docs.python.org/3/library/os.html#os.popen"
    - "https://docs.python.org/3/whatsnew/3.8.html#removed"

- id: "PY37SL58"
  name: "macpath module removed"
  category: "breaking_change"
  severity: "medium"
  risk_level: "MEDIUM"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    The macpath module, deprecated in Python 3.7, has been removed.
    Use os.path instead.
  detector: "ImportChangesDetector"
  pattern:
    node_type: "Import"
    children:
      names:
        - node_type: "alias"
          attributes:
            name: "macpath"
  message: |
    The macpath module was removed in Python 3.8. Use os.path instead.
  suggestion: |
    Replace 'import macpath' with 'import os.path' and use os.path functions.
  examples:
    bad: |
      import macpath
      path = macpath.join('a', 'b')
    good: |
      import os.path
      path = os.path.join('a', 'b')
  references:
    - "https://docs.python.org/3/whatsnew/3.8.html#removed"
    - "https://bugs.python.org/issue35471"

- id: "PY37SL59"
  name: "pyvenv script removed"
  category: "breaking_change"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    The pyvenv script has been removed in favor of 'python3.8 -m venv' to
    help eliminate confusion as to what Python interpreter the pyvenv
    script is tied to.
  detector: "CommandUsageDetector"
  pattern:
    node_type: "Str"
  condition:
    contains: "pyvenv"
  message: |
    The pyvenv script was removed in Python 3.8. Use 'python -m venv' instead.
  suggestion: |
    Replace 'pyvenv env' with 'python3.8 -m venv env' or 'python -m venv env'.
  examples:
    bad: |
      pyvenv myenv
    good: |
      python -m venv myenv
      python3.8 -m venv myenv
  references:
    - "https://docs.python.org/3/whatsnew/3.8.html#removed"
    - "https://bugs.python.org/issue25427"

- id: "PY37SL60"
  name: "csv.DictReader returns dict instead of OrderedDict"
  category: "api_change"
  severity: "low"
  risk_level: "LOW"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    csv.DictReader now returns dict instances instead of OrderedDict.
    Regular dicts now preserve insertion order, making this change safe
    for most code, but code that explicitly relies on OrderedDict type
    may need updating.
  detector: "StdlibChangesDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "csv.DictReader"
  message: |
    csv.DictReader returns dict instead of OrderedDict in Python 3.8+.
  suggestion: |
    If you need OrderedDict specifically, wrap the result in OrderedDict().
  examples:
    bad: |
      import csv
      from collections import OrderedDict
      reader = csv.DictReader(f)
      row = next(reader)
      assert isinstance(row, OrderedDict)  # Fails in 3.8+
    good: |
      import csv
      reader = csv.DictReader(f)
      row = next(reader)
      # row is a dict in 3.8+
  references:
    - "https://docs.python.org/3/library/csv.html#csv.DictReader"
    - "https://docs.python.org/3/whatsnew/3.8.html#csv"
    - "https://bugs.python.org/issue34003"

- id: "PY37SL61"
  name: "New typing module features (TypedDict, Literal, Final, Protocol)"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds several major typing features: TypedDict (PEP 589),
    Literal (PEP 586), Final (PEP 591), and Protocol (PEP 544).
  detector: "NewFeatureDetector"
  pattern:
    node_type: "ImportFrom"
  condition:
    imports_from_typing: "TypedDict|Literal|Final|Protocol"
  message: |
    typing.TypedDict, Literal, Final, and Protocol are new in Python 3.8.
  suggestion: |
    If you need to support Python 3.7, use typing_extensions backport.
  references:
    - "https://docs.python.org/3/whatsnew/3.8.html#typing"

- id: "PY37SL62"
  name: "New statistics module features"
  category: "new_feature"
  severity: "info"

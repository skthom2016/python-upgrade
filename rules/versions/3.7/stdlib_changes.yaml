- id: "PY37SL26"
  name: "pprint.pp() and sort_dicts parameter added"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds pprint.pp() convenience function with sort_dicts defaulting to
    False, and adds sort_dicts parameter to several pprint functions.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "regex:(pprint\\.pp|pprint\\.pprint|pprint\\.pformat)"
  message: |
    The sort_dicts parameter and pprint.pp() function are new in Python 3.8.
  examples:
    good: |
      # Python 3.8+
      import pprint

      # pp() - preserves insertion order, same as pprint(..., sort_dicts=False)
      pprint.pp({'a': 1, 'b': 2})

      # pprint() - sorts alphabetically by default
      pprint({'a': 1, 'b': 2}, sort_dicts=True)

      # pformat() also accepts sort_dicts
      print(pprint.pformat({'a': 1, 'b': 2}, sort_dicts=True))
  references:
    - "https://docs.python.org/3/library/pprint.html"
    - "https://bugs.python.org/issue30670"

- id: "PY37SL27"

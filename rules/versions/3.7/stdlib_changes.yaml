  message: |
    New statistics features are not available in Python 3.7.
  references:
    - "https://docs.python.org/3/whatsnew/3.8.html#statistics"

- id: "PY37SL63"
  name: "New functools features (cached_property, singledispatchmethod)"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds functools.cached_property and singledispatchmethod.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Name"
  condition:
    imported_from_functools: "cached_property|singledispatchmethod"
  message: |
    functools.cached_property and singledispatchmethod are new in Python 3.8.
  references:
    - "https://docs.python.org/3/whatsnew/3.8.html#functools"

- id: "PY37SL64"
  name: "New unittest features (AsyncMock, IsolatedAsyncioTestCase)"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds unittest.mock.AsyncMock and IsolatedAsyncioTestCase
    for async testing.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Name"
  condition:
    imported_from_unittest: "AsyncMock|IsolatedAsyncioTestCase"
  message: |

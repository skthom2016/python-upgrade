# Standard library changes when upgrading from Python 3.7 to 3.8+
# Changes to modules, functions, and classes in the Python standard library

# --- NEW MODULES IN PYTHON 3.8 ---

- id: "PY37SL01"
  name: "New importlib.metadata module"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 introduces the new importlib.metadata module (provisional) for
    reading metadata from third-party packages.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "ImportFrom"
    children:
      module:
        node_type: "str"
        value: "importlib.metadata"
      names:
        - node_type: "alias"
          attributes:
            name: "regex:(version|requires|files|packages|distribution)"
  message: |
    The importlib.metadata module is new in Python 3.8. This code will not work
    in Python 3.7.
  suggestion: |
    If you need to support Python 3.7, avoid using importlib.metadata or provide
    alternative implementations using pkg_resources or setuptools.
  examples:
    good: |
      # Python 3.8+
      from importlib.metadata import version, requires, files
      version('requests')
      list(requires('requests'))
  references:
    - "https://docs.python.org/3/library/importlib.html#importlib.metadata"
    - "https://bugs.python.org/issue34632"

# --- MATH MODULE ADDITIONS ---

- id: "PY37SL02"
  name: "New math.dist() function"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds math.dist() for computing Euclidean distance between
    two points.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "math.dist"
  message: |
    The math.dist() function is new in Python 3.8. This code will not work
    in Python 3.7.
  suggestion: |
    If you need to support Python 3.7, implement your own distance calculation:
    math.sqrt(sum((a - b) ** 2 for a, b in zip(x1, x2))).
  examples:
    good: |
      # Python 3.8+
      import math
      distance = math.dist((x1, y1), (x2, y2))
  references:
    - "https://docs.python.org/3/library/math.html#math.dist"
    - "https://bugs.python.org/issue33089"

- id: "PY37SL03"
  name: "math.hypot() expanded to multiple dimensions"
  category: "api_change"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    The math.hypot() function has been expanded to handle multiple dimensions.
    Formerly, it only supported the 2-D case.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "math.hypot"
    num_args_greater_than: 2
  message: |
    math.hypot() now supports multiple dimensions in Python 3.8+. This code
    will not work in Python 3.7.
  suggestion: |
    If you need to support Python 3.7, use math.sqrt(sum(x**2 for x in coordinates))
    instead.
  examples:
    good: |
      # Python 3.8+
      import math
      distance = math.hypot(x1, y1, z1)
  references:
    - "https://docs.python.org/3/library/math.html#math.hypot"
    - "https://bugs.python.org/issue33089"

- id: "PY37SL04"
  name: "New math.prod() function"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds math.prod(), as analogous function to sum() that returns
    the product of a 'start' value (default: 1) times an iterable of numbers.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "math.prod"
  message: |
    The math.prod() function is new in Python 3.8. This code will not work
    in Python 3.7.
  suggestion: |
    If you need to support Python 3.7, use functools.reduce(operator.mul, iterable, 1)
    instead.
  examples:
    good: |
      # Python 3.8+
      import math
      product = math.prod([1, 2, 3, 4])
  references:
    - "https://docs.python.org/3/library/math.html#math.prod"
    - "https://bugs.python.org/issue35606"

- id: "PY37SL05"
  name: "New math.perm() and math.comb() functions"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds two new combinatoric functions math.perm() and
    math.comb() for permutations and combinations.
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "regex:(math\\.perm|math\\.comb)"
  message: |
    The math.perm() and math.comb() functions are new in Python 3.8. This
    code will not work in Python 3.7.
  suggestion: |
    If you need to support Python 3.7, use manual calculation or third-party
    libraries like scipy instead.
  examples:
    good: |
      # Python 3.8+
      import math
      n = math.perm(10, 3)  # Permutations of 10 things taken 3 at a time
      k = math.comb(10, 3)  # Combinations of 10 things taken 3 at a time
  references:
    - "https://docs.python.org/3/library/math.html#math.perm"
    - "https://docs.python.org/3/library/math.html#math.comb"
    - "https://bugs.python.org/issue37128"
    - "https://bugs.python.org/issue37178"


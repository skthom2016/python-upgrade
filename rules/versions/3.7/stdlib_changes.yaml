  references:
    - "https://docs.python.org/3/library/xml.etree.elementtree.html#xml.etree.ElementTree.canonicalize"
    - "https://bugs.python.org/issue13611"

- id: "PY37SL28"
  name: "xml.etree.ElementTree wildcard searches added"
  category: "new_feature"
  severity: "info"
  risk_level: "INFO"
  source_version: "3.7"
  target_version: "3.8"
  description: |
    Python 3.8 adds wildcard searches to xml.etree.ElementTree.find*() methods:
    {*}tag (ignores namespace) and {namespace}* (returns all tags in namespace).
  detector: "NewFeatureDetector"
  pattern:
    node_type: "Call"
  condition:
    func_is: "regex:(xml\\.etree\\.ElementTree\\.find|xml\\.etree\\.ElementTree\\.findall|xml\\.etree\\.ElementTree\\.findall)"
    has_wildcard_in_pattern: true
  message: |
    Wildcard searches in xml.etree.ElementTree are new in Python 3.8.
  examples:
    good: |
      # Python 3.8+
      import xml.etree.ElementTree as ET
      # Ignore namespace
      for elem in root.findall('.//*{*}tag'):
          print(elem.tag)

      # Specific namespace
      for elem in root.findall('{*}tag'):
          print(elem.tag)
  references:
    - "https://docs.python.org/3/library/xml.etree.elementtree.html#xml.etree.ElementTree.find"
    - "https://bugs.python.org/issue28238"

- id: "PY37SL29"
